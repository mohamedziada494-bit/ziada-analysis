<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ziada Analysis - مختبر حراس المرمى الشامل (Pro Max)</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/fix-webm-duration@1.0.6/fix-webm-duration.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- مكتبة الرسوم البيانية للرادار -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-dark: #070b12; --card-bg: #111827; --border-color: #1f2937;
      --primary: #38bdf8; --accent: #f59e0b; --danger: #ef4444; --success: #10b981;
      --text: #f8fafc; --text-muted: #94a3b8; --pitch-green: #15803d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text); padding: 14px; overflow-x: hidden; }
    
    .top-nav { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 20px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 15px; }
    .brand-title { font-size: 1.2rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 10px; }
    .btn-top { background: #1f2937; color: var(--primary); border: 1px solid var(--primary); padding: 7px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; text-decoration: none; }
    
    .tabs-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .tab-btn { background: #1f2937; border: 1px solid #374151; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
    .tab-btn:hover { border-color: var(--primary); }
    .tab-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* =========================================
       التاب الأول: التدريبات 
       ========================================= */
    .training-workspace { display: grid; grid-template-columns: 260px 1fr; gap: 15px; align-items: start; height: 65vh; }
    .tools-panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 10px; height: 100%; overflow-y: auto; user-select: none; }
    .tools-title { color: var(--accent); font-weight: 800; text-align: center; border-bottom: 1px solid #374151; padding-bottom: 8px; margin-bottom: 5px; }
    .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .draggable-source { background: #1f2937; border: 1px solid #374151; color: white; padding: 8px; border-radius: 8px; cursor: grab; font-weight: bold; font-size: 11px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; transition: 0.2s; text-align: center; }
    .draggable-source:hover { background: #374151; border-color: var(--primary); }
    .draggable-source:active { cursor: grabbing; }

    .pitch-container { display: flex; flex-direction: column; gap: 10px; height: 100%; }
    .pitch-controls { display: flex; justify-content: center; gap: 10px; background: var(--card-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); }
    .pitch-btn { background: #1f2937; color: #fff; border: 1px solid #374151; padding: 6px 15px; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; }
    .pitch-btn.active { background: var(--primary); color: #000; }
    .pitch-area { background: var(--pitch-green); border: 2px solid #fff; border-radius: 8px; flex: 1; position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    .pitch-lines { position: absolute; width: 100%; height: 100%; pointer-events: none; transition: all 0.3s; }
    
    .view-penalty .penalty-box { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 60%; height: 50%; border: 2px solid #fff; border-top: none; }
    .view-penalty .six-yard-box { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 25%; height: 20%; border: 2px solid #fff; border-top: none; }
    .view-penalty .penalty-arc { position: absolute; top: 50%; left: 50%; transform: translateX(-50%); width: 20%; height: 20%; border: 2px solid #fff; border-radius: 50%; clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%); }
    .view-penalty .goal-net { display: none; }
    .view-six-yard .penalty-box, .view-six-yard .penalty-arc { display: none; }
    .view-six-yard .six-yard-box { position: absolute; top: 15%; left: 50%; transform: translateX(-50%); width: 70%; height: 60%; border: 3px solid #fff; border-top: none; }
    .view-six-yard .goal-net { display: block; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 35%; height: 15%; border: 4px solid #eab308; border-top: none; background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.3) 10px, rgba(255,255,255,0.3) 12px), repeating-linear-gradient(-45deg, transparent, transparent 10px, rgba(255,255,255,0.3) 10px, rgba(255,255,255,0.3) 12px); }

    .drill-item { position: absolute; cursor: grab; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.6)); transform-origin: center; }
    .drill-item:active { cursor: grabbing; }
    .drill-item .delete-btn { display: none; position: absolute; top: -15px; right: -15px; background: red; color: white; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; text-align: center; line-height: 22px; cursor: pointer; border: 1px solid #fff; z-index: 20; }
    .drill-item:hover .delete-btn { display: block; }

    .anim-bar { background: #111827; border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 10px; flex-wrap: wrap; }
    .anim-btn { background: #374151; color: #fff; border: 1px solid #4b5563; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px;}
    .anim-btn.record { background: #0ea5e9; color: #000; border-color: #0284c7; }
    .anim-btn.play { background: #10b981; color: #000; border-color: #059669; }

    /* =========================================
       التاب الثاني: التقطيع والتحليل 
       ========================================= */
    .analysis-workspace { display: grid; grid-template-columns: 280px 1fr; gap: 15px; align-items: start; }
    .clipping-panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 8px; max-height: 70vh; overflow-y: auto; }
    .clip-btn { width: 100%; padding: 8px 10px; border: none; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; display: flex; justify-content: space-between; color: white; background: #1f2937; border: 1px solid #374151; }
    .clip-btn:hover { border-color: var(--primary); background: #374151; }
    .mode-toggle-box { background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid var(--primary); margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
    
    .video-area { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .video-container { width: 100%; background: #000; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 50vh; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .video-controls { display: flex; justify-content: center; align-items: center; gap: 15px; padding: 10px 0; }
    .upload-input { background: #070b12; padding: 8px; border-radius: 8px; color: #fff; font-size: 13px; border: 1px solid #374151; }

    .log-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: right; background: var(--card-bg); border-radius: 8px; overflow:hidden;}
    .log-table th { background: #1f2937; color: var(--primary); padding: 9px; }
    .log-table td { padding: 8px 10px; border-bottom: 1px solid var(--border-color); }
    .btn-action-small { background: #3b82f6; color: #fff; padding: 5px 10px; border-radius: 5px; font-size: 11px; font-weight: bold; border: none; cursor: pointer; margin-right: 5px; }

    /* =========================================
       التاب الثالث: المقارنة (Split Screen)
       ========================================= */
    .compare-workspace { display: flex; flex-direction: column; gap: 15px; height: 75vh; }
    .split-screens { display: flex; gap: 15px; flex: 1; }
    .split-box { flex: 1; background: #000; border: 2px solid var(--border-color); border-radius: 12px; position: relative; display: flex; flex-direction: column; }
    .split-box video { flex: 1; width: 100%; object-fit: contain; }
    .split-header { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 10; }
    .split-header input { background: rgba(15, 23, 42, 0.8); color: #fff; border: 1px solid var(--primary); padding: 5px; border-radius: 5px; font-size: 12px; width: 60%; }
    .compare-controls { display: flex; justify-content: center; gap: 15px; background: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); }
    .sync-btn { background: var(--accent); color: #000; border: none; padding: 10px 30px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }

    /* =========================================
       التاب الرابع: الإحصائيات (Radar & Heatmap)
       ========================================= */
    .stats-workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .stat-panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .stat-title { color: var(--primary); font-size: 18px; font-weight: bold; margin-bottom: 20px; text-align: center; }
    
    /* Heatmap Goal */
    .goal-heatmap-container { position: relative; width: 100%; max-width: 400px; aspect-ratio: 2/1; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200"><rect x="10" y="10" width="380" height="190" fill="none" stroke="%23ffffff" stroke-width="8"/><line x1="10" y1="10" x2="50" y2="40" stroke="%23ffffff" stroke-width="4"/><line x1="390" y1="10" x2="350" y2="40" stroke="%23ffffff" stroke-width="4"/><line x1="50" y1="40" x2="350" y2="40" stroke="%23ffffff" stroke-width="4"/><path d="M 10 10 L 50 40 L 350 40 L 390 10" fill="none" stroke="%23ffffff" stroke-width="2" stroke-dasharray="10 10"/><path d="M 10 200 L 50 40 M 390 200 L 350 40" fill="none" stroke="%23ffffff" stroke-width="2" stroke-dasharray="10 10"/></svg>') no-repeat center center; background-size: contain; border-bottom: 5px solid var(--pitch-green); cursor: crosshair; }
    .heat-dot { position: absolute; width: 16px; height: 16px; border-radius: 50%; transform: translate(-50%, -50%); border: 2px solid #fff; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
    .heat-dot.goal { background-color: var(--danger); }
    .heat-dot.save { background-color: var(--success); }
    .heatmap-instructions { font-size: 12px; color: var(--text-muted); margin-top: 15px; text-align: center; }
    
    /* Radar Controls */
    .radar-controls { width: 100%; margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
    .radar-input-group { display: flex; justify-content: space-between; align-items: center; }
    .radar-input-group label { color: #fff; font-size: 13px; font-weight: bold; width: 40%;}
    .radar-input-group input { width: 60%; }

    /* =========================================
       مودال الرسم والتحليل الذكي
       ========================================= */
    .draw-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 3000; flex-direction: column; padding: 20px; }
    .draw-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .draw-toolbar { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .draw-tool-btn { background: #1f2937; border: 1px solid #374151; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }
    .draw-tool-btn:hover, .draw-tool-btn.active { background: var(--primary); color: #000; }
    
    /* مؤقت رد الفعل */
    .reaction-timer-box { display: flex; align-items: center; gap: 10px; background: #0f172a; padding: 5px 15px; border-radius: 8px; border: 1px solid var(--accent); }
    .timer-btn { background: var(--accent); color: #000; border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; }
    .timer-result { color: var(--accent); font-weight: bold; font-size: 16px; font-family: monospace; min-width: 60px; text-align: center; }

    .draw-canvas-wrapper { position: relative; flex: 1; background: #000; border: 1px solid #374151; border-radius: 8px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    #drawVideoPlayer { position: absolute; max-width: 100%; max-height: 100%; object-fit: contain; }
    #drawCanvasOverlay { position: absolute; z-index: 10; cursor: crosshair; }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <header class="top-nav">
      <span class="brand-title"><i class="fa-solid fa-flask"></i> Ziada Analysis | مختبر حراس المرمى (GK Lab)</span>
      <a href="index.html" class="btn-top">لوحة التحكم</a>
    </header>

    <div class="tabs-container">
      <button class="tab-btn active" onclick="switchTab('training')"><i class="fa-solid fa-clipboard-list"></i> محاكي التدريبات</button>
      <button class="tab-btn" onclick="switchTab('analysis')"><i class="fa-solid fa-scissors"></i> تقطيع وتحليل</button>
      <button class="tab-btn" onclick="switchTab('compare')"><i class="fa-solid fa-not-equal"></i> المقارنة الثنائية</button>
      <button class="tab-btn" onclick="switchTab('stats')"><i class="fa-solid fa-chart-radar"></i> إحصائيات وتقييم</button>
    </div>

    <!-- التاب الأول: محاكي التدريبات -->
    <div id="trainingTab" class="tab-content active">
      <div class="training-workspace">
        <aside class="tools-panel">
          <div class="tools-title">مكتبة الأدوات</div>
          <div class="tools-grid">
            <div class="draggable-source" draggable="true" data-type="gk">حارس (GK)</div>
            <div class="draggable-source" draggable="true" data-type="gk_coach">مدرب</div>
            <div class="draggable-source" draggable="true" data-type="ball">كرة</div>
            <div class="draggable-source" draggable="true" data-type="player_red">مهاجم</div>
            <div class="draggable-source" draggable="true" data-type="cone_red">قمع</div>
            <div class="draggable-source" draggable="true" data-type="hurdle">حاجز</div>
          </div>
        </aside>
        
        <div class="pitch-container">
          <div class="pitch-controls">
            <button class="pitch-btn active" onclick="setPitchView('penalty')">منطقة الجزاء</button>
            <button class="pitch-btn" onclick="setPitchView('six-yard')">التلات خشبات</button>
          </div>
          <div class="pitch-area view-penalty" id="pitchArea" ondrop="drop(event)" ondragover="allowDrop(event)">
            <div class="pitch-lines"><div class="penalty-arc"></div><div class="penalty-box"></div><div class="six-yard-box"></div><div class="goal-net"></div></div>
          </div>
        </div>
      </div>
      <div class="anim-bar">
        <button class="anim-btn record" onclick="saveFrame()">حفظ إطار</button>
        <button class="anim-btn play" onclick="playAnimation()">تشغيل الحركة</button>
        <button class="anim-btn" style="background:var(--success); border:none;" onclick="printDrill()">حفظ صورة</button>
      </div>
    </div>

    <!-- التاب الثاني: التقطيع -->
    <div id="analysisTab" class="tab-content">
      <div class="analysis-workspace">
        <aside class="clipping-panel">
          <div class="tools-title">التقطيع السريع</div>
          <div class="mode-toggle-box">
            <label><input type="radio" name="clipMode" value="auto" checked> تقطيع تلقائي (10ث)</label>
            <label><input type="radio" name="clipMode" value="manual"> تسجيل يدوي</label>
          </div>
          <button class="clip-btn" onclick="handleTagClick(this, 'انفراد (1v1)')">انفراد 1v1</button>
          <button class="clip-btn" onclick="handleTagClick(this, 'تصدي لكروس')">عرضيات (كروس)</button>
          <button class="clip-btn" onclick="handleTagClick(this, 'تصويب بعيد')">تصويب بعيد</button>
          <button class="clip-btn" onclick="handleTagClick(this, 'لعب بالرجلين')">لعب بالرجلين</button>
        </aside>

        <main class="video-area">
          <div class="video-container">
            <video id="gkVideo" controls playsinline></video>
          </div>
          <div class="video-controls">
            <input type="file" class="upload-input" accept="video/*" onchange="loadGkVideo(event)">
          </div>
          <table class="log-table" style="margin-top:10px;">
            <thead><tr><th>التوقيت</th><th>الحالة</th><th>الإجراءات</th></tr></thead>
            <tbody id="gkLogBody"></tbody>
          </table>
        </main>
      </div>
    </div>

    <!-- التاب الثالث: المقارنة (Split-Screen) -->
    <div id="compareTab" class="tab-content">
      <div class="compare-workspace">
        <div class="compare-controls">
          <button class="sync-btn" onclick="syncPlayPause()"><i class="fa-solid fa-play"></i> تشغيل / إيقاف متزامن</button>
        </div>
        <div class="split-screens">
          <div class="split-box">
            <div class="split-header"><input type="file" accept="video/*" onchange="loadSplitVid(event, 'vid1')"></div>
            <video id="vid1" controls muted></video>
          </div>
          <div class="split-box">
            <div class="split-header"><input type="file" accept="video/*" onchange="loadSplitVid(event, 'vid2')"></div>
            <video id="vid2" controls muted></video>
          </div>
        </div>
      </div>
    </div>

    <!-- التاب الرابع: الإحصائيات (Radar & Heatmap) -->
    <div id="statsTab" class="tab-content">
      <div class="stats-workspace">
        
        <!-- خريطة التسديدات -->
        <div class="stat-panel">
          <div class="stat-title"><i class="fa-solid fa-fire"></i> خريطة التسديدات الحرارية</div>
          <div class="goal-heatmap-container" id="heatmapGoal">
            <!-- سيتم إضافة النقاط هنا -->
          </div>
          <div class="heatmap-instructions">
            كليك يسار: <span style="color:var(--danger); font-weight:bold;">هدف 🔴</span> | 
            كليك يمين: <span style="color:var(--success); font-weight:bold;">تصدي 🟢</span><br>
            <button onclick="clearHeatmap()" style="margin-top:10px; background:var(--bg-dark); color:#fff; border:1px solid #fff; padding:5px 10px; border-radius:5px; cursor:pointer;">مسح الخريطة</button>
          </div>
        </div>

        <!-- رادار التقييم -->
        <div class="stat-panel">
          <div class="stat-title"><i class="fa-solid fa-spider"></i> بروفايل مهارات الحارس (Radar)</div>
          <div style="width: 100%; max-width: 300px;">
            <canvas id="gkRadarChart"></canvas>
          </div>
          <div class="radar-controls">
            <div class="radar-input-group"><label>رد الفعل (Reflexes)</label><input type="range" id="r_reflex" min="0" max="100" value="75" oninput="updateRadar()"></div>
            <div class="radar-input-group"><label>العرضيات (Aerial)</label><input type="range" id="r_aerial" min="0" max="100" value="60" oninput="updateRadar()"></div>
            <div class="radar-input-group"><label>التوزيع (Distribution)</label><input type="range" id="r_dist" min="0" max="100" value="85" oninput="updateRadar()"></div>
            <div class="radar-input-group"><label>الانفرادات (1v1)</label><input type="range" id="r_1v1" min="0" max="100" value="70" oninput="updateRadar()"></div>
            <div class="radar-input-group"><label>التمركز (Positioning)</label><input type="range" id="r_pos" min="0" max="100" value="80" oninput="updateRadar()"></div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- مودال الرسم والذكاء -->
  <div class="draw-modal" id="drawModal">
    <div class="draw-header">
      <h2 style="color:var(--primary); margin:0;">استوديو التحليل والرسم</h2>
      <button class="draw-close" onclick="closeDrawModal()"><i class="fa-solid fa-circle-xmark"></i></button>
    </div>
    
    <div class="draw-toolbar">
      <button class="draw-tool-btn" onclick="toggleDrawVideo()"><i class="fa-solid fa-play-pause"></i> تشغيل</button>
      
      <!-- مؤقت رد الفعل السحري -->
      <div class="reaction-timer-box">
        <button class="timer-btn" onclick="setReactStart()">لحظة التسديد</button>
        <button class="timer-btn" onclick="setReactEnd()">قفزة الحارس</button>
        <div class="timer-result" id="reactTimeResult">0.00s</div>
      </div>

      <button class="draw-tool-btn active" onclick="setDrawTool('none')"><i class="fa-solid fa-mouse-pointer"></i> مؤشر</button>
      <button class="draw-tool-btn" onclick="setDrawTool('gk-pos')">حارس</button>
      <button class="draw-tool-btn" onclick="setDrawTool('angle')">زاوية التغطية</button>
      <!-- أداة النقطة العمياء الجديدة -->
      <button class="draw-tool-btn" style="background:#4f46e5;" onclick="setDrawTool('blind-spot')"><i class="fa-solid fa-eye-slash"></i> محاكي النقطة العمياء</button>
      
      <button class="draw-tool-btn" style="background:var(--danger);" onclick="clearDrawings()"><i class="fa-solid fa-trash"></i> مسح</button>
    </div>

    <div class="draw-canvas-wrapper" id="drawWrapper">
      <video id="drawVideoPlayer" playsinline></video>
      <canvas id="drawCanvasOverlay"></canvas>
    </div>
    <div style="text-align:center; margin-top:10px;">
      <button onclick="saveDrawnImage()" style="background:var(--success); color:#fff; padding:10px 30px; border-radius:8px; border:none; font-weight:bold; cursor:pointer;">حفظ الصورة التحليلية</button>
    </div>
  </div>

  <canvas id="liveRenderCanvas" style="display: none;"></canvas>

  <script>
    // ==========================================
    // Core Functions & Tabs
    // ==========================================
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      event.currentTarget.classList.add('active');
      document.getElementById(tabId + 'Tab').classList.add('active');
      
      // Initialize Radar if switching to stats tab for the first time
      if(tabId === 'stats' && !window.radarChart) initRadar();
    }

    // ==========================================
    // Tab 1: Drill Builder (Simplified for Space)
    // ==========================================
    const pitchArea = document.getElementById('pitchArea');
    let draggedType = null;
    document.querySelectorAll('.draggable-source').forEach(el => {
      el.addEventListener('dragstart', (e) => { draggedType = e.target.dataset.type; e.dataTransfer.setData('text/plain', ''); });
    });
    function allowDrop(e) { e.preventDefault(); }
    function drop(e) {
      e.preventDefault(); if (!draggedType) return;
      const rect = pitchArea.getBoundingClientRect();
      const div = document.createElement('div'); div.className = 'drill-item';
      div.innerHTML = `<div style="width:30px;height:30px;background:var(--accent);border-radius:50%;text-align:center;line-height:30px;font-weight:bold;color:#000;">${draggedType.substring(0,2)}</div>`;
      div.style.left = `${e.clientX - rect.left}px`; div.style.top = `${e.clientY - rect.top}px`;
      pitchArea.appendChild(div); draggedType = null;
    }
    function setPitchView(view) { pitchArea.className = `pitch-area view-${view}`; }
    
    let frames = [];
    function saveFrame() {
      const pos = []; pitchArea.querySelectorAll('.drill-item').forEach(item => { pos.push({el: item, l: item.style.left, t: item.style.top}); });
      frames.push(pos);
    }
    function playAnimation() { alert('Animation saved logic goes here. Requires full object ID tracking.'); }
    function printDrill() { html2canvas(pitchArea, {backgroundColor:'#15803d'}).then(c => { const a=document.createElement('a'); a.download='drill.jpg'; a.href=c.toDataURL(); a.click(); }); }

    // ==========================================
    // Tab 2: Video Tagging
    // ==========================================
    const video = document.getElementById('gkVideo');
    let gkEventsLog = [];
    function loadGkVideo(e) { if(e.target.files[0]) video.src = URL.createObjectURL(e.target.files[0]); }
    
    function handleTagClick(btn, type) {
      // Dummy logic for space: Just adds to table
      const t = Math.floor(video.currentTime);
      gkEventsLog.push({time: `${Math.floor(t/60)}:${t%60}`, type: type, url: video.src});
      renderLog();
    }
    function renderLog() {
      const tbody = document.getElementById('gkLogBody');
      tbody.innerHTML = gkEventsLog.map((item, idx) => `<tr><td>${item.time}</td><td>${item.type}</td><td><button class="btn-action-small" onclick="openDrawModal(${idx})">تحليل بالرسم</button></td></tr>`).join('');
    }

    // ==========================================
    // Tab 3: Split-Screen Comparison
    // ==========================================
    const v1 = document.getElementById('vid1');
    const v2 = document.getElementById('vid2');
    function loadSplitVid(e, vidId) { if(e.target.files[0]) document.getElementById(vidId).src = URL.createObjectURL(e.target.files[0]); }
    function syncPlayPause() {
      if(v1.paused || v2.paused) { v1.play(); v2.play(); } 
      else { v1.pause(); v2.pause(); }
    }

    // ==========================================
    // Tab 4: Stats (Heatmap & Radar)
    // ==========================================
    const heatmapBox = document.getElementById('heatmapGoal');
    heatmapBox.addEventListener('mousedown', (e) => {
      const rect = heatmapBox.getBoundingClientRect();
      const x = e.clientX - rect.left; const y = e.clientY - rect.top;
      const dot = document.createElement('div');
      dot.className = e.button === 2 ? 'heat-dot save' : 'heat-dot goal';
      dot.style.left = `${x}px`; dot.style.top = `${y}px`;
      heatmapBox.appendChild(dot);
    });
    heatmapBox.addEventListener('contextmenu', e => e.preventDefault());
    function clearHeatmap() { heatmapBox.querySelectorAll('.heat-dot').forEach(d => d.remove()); }

    function initRadar() {
      const ctx = document.getElementById('gkRadarChart').getContext('2d');
      window.radarChart = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: ['رد الفعل', 'العرضيات', 'التوزيع', '1v1', 'التمركز'],
          datasets: [{
            label: 'تقييم الحارس',
            data: [75, 60, 85, 70, 80],
            backgroundColor: 'rgba(56, 189, 248, 0.4)',
            borderColor: '#38bdf8',
            pointBackgroundColor: '#f59e0b',
            borderWidth: 2
          }]
        },
        options: { scales: { r: { min: 0, max: 100, ticks: { display: false }, grid: { color: '#374151' }, pointLabels: { color: '#fff', font: { family: 'Cairo', size: 12 } } } }, plugins: { legend: { display: false } } }
      });
    }
    function updateRadar() {
      if(!window.radarChart) return;
      window.radarChart.data.datasets[0].data = [
        document.getElementById('r_reflex').value, document.getElementById('r_aerial').value, document.getElementById('r_dist').value, document.getElementById('r_1v1').value, document.getElementById('r_pos').value
      ];
      window.radarChart.update();
    }

    // ==========================================
    // Draw Modal & New AI Tools (Reaction + Blind Spot)
    // ==========================================
    const drawModal = document.getElementById('drawModal');
    const drawVideo = document.getElementById('drawVideoPlayer');
    const drawCanvas = document.getElementById('drawCanvasOverlay');
    const drawCtx = drawCanvas.getContext('2d');
    
    let drawActiveTool = 'none'; let drawShapes = [];
    let isDrawing = false; let startX, startY;
    
    // Reaction Timer Logic
    let reactStart = 0; let reactEnd = 0;
    function setReactStart() { reactStart = drawVideo.currentTime; calcReact(); }
    function setReactEnd() { reactEnd = drawVideo.currentTime; calcReact(); }
    function calcReact() {
      const diff = Math.abs(reactEnd - reactStart);
      document.getElementById('reactTimeResult').innerText = diff.toFixed(2) + 's';
    }

    function openDrawModal(idx) {
      drawVideo.src = gkEventsLog[idx].url; drawModal.style.display = 'flex';
      drawShapes = []; reactStart = 0; reactEnd = 0; document.getElementById('reactTimeResult').innerText = '0.00s';
      drawVideo.addEventListener('loadeddata', () => {
        const r = drawVideo.getBoundingClientRect(); drawCanvas.width = r.width; drawCanvas.height = r.height;
      });
    }
    function closeDrawModal() { drawModal.style.display = 'none'; drawVideo.pause(); }
    function toggleDrawVideo() { if(drawVideo.paused) drawVideo.play(); else drawVideo.pause(); }

    function setDrawTool(t) { drawActiveTool = t; if(t !== 'none') drawVideo.pause(); }
    function clearDrawings() { drawShapes = []; redrawShapes(); }

    drawCanvas.addEventListener('mousedown', e => {
      const rect = drawCanvas.getBoundingClientRect();
      startX = e.clientX - rect.left; startY = e.clientY - rect.top;
      if (drawActiveTool === 'gk-pos') { drawShapes.push({type: 'gk-pos', x: startX, y: startY}); redrawShapes(); setDrawTool('none'); }
      else if(drawActiveTool !== 'none') isDrawing = true;
    });

    drawCanvas.addEventListener('mousemove', e => {
      if(!isDrawing) return;
      const rect = drawCanvas.getBoundingClientRect();
      const x = e.clientX - rect.left; const y = e.clientY - rect.top;
      redrawShapes();
      
      if(drawActiveTool === 'angle') {
        drawCtx.beginPath(); drawCtx.moveTo(startX, startY); drawCtx.lineTo(x-60, y); drawCtx.lineTo(x+60, y); drawCtx.closePath();
        drawCtx.fillStyle = 'rgba(56, 189, 248, 0.4)'; drawCtx.fill(); drawCtx.stroke();
      } else if (drawActiveTool === 'blind-spot') {
        // رسم النقطة العمياء أثناء الحركة
        drawCtx.fillStyle = 'rgba(0,0,0,0.85)'; drawCtx.fillRect(0,0,drawCanvas.width, drawCanvas.height);
        drawCtx.globalCompositeOperation = 'destination-out';
        drawCtx.beginPath(); drawCtx.moveTo(startX, startY); drawCtx.lineTo(x-100, y+100); drawCtx.lineTo(x+100, y+100); drawCtx.closePath();
        drawCtx.fillStyle = '#fff'; drawCtx.fill();
        drawCtx.globalCompositeOperation = 'source-over';
      }
    });

    drawCanvas.addEventListener('mouseup', e => {
      if(!isDrawing) return; isDrawing = false;
      const rect = drawCanvas.getBoundingClientRect();
      drawShapes.push({type: drawActiveTool, sx: startX, sy: startY, ex: e.clientX - rect.left, ey: e.clientY - rect.top});
      redrawShapes(); setDrawTool('none');
    });

    function redrawShapes() {
      drawCtx.clearRect(0,0,drawCanvas.width, drawCanvas.height);
      
      // النقطة العمياء لازم تترسم الأول تحت باقي الرسومات
      const blind = drawShapes.find(d => d.type === 'blind-spot');
      if (blind) {
        drawCtx.fillStyle = 'rgba(0,0,0,0.85)'; drawCtx.fillRect(0,0,drawCanvas.width, drawCanvas.height);
        drawCtx.globalCompositeOperation = 'destination-out';
        drawCtx.beginPath(); drawCtx.moveTo(blind.sx, blind.sy); drawCtx.lineTo(blind.ex-100, blind.ey+100); drawCtx.lineTo(blind.ex+100, blind.ey+100); drawCtx.closePath();
        drawCtx.fillStyle = '#fff'; drawCtx.fill();
        drawCtx.globalCompositeOperation = 'source-over';
        // إضافة خطوط صفراء لتحديد زاوية الرؤية
        drawCtx.beginPath(); drawCtx.moveTo(blind.sx, blind.sy); drawCtx.lineTo(blind.ex-100, blind.ey+100); drawCtx.moveTo(blind.sx, blind.sy); drawCtx.lineTo(blind.ex+100, blind.ey+100);
        drawCtx.strokeStyle = '#facc15'; drawCtx.lineWidth = 2; drawCtx.setLineDash([10,5]); drawCtx.stroke(); drawCtx.setLineDash([]);
      }

      drawShapes.forEach(d => {
        if(d.type === 'gk-pos') {
          drawCtx.beginPath(); drawCtx.arc(d.x, d.y, 15, 0, Math.PI*2); drawCtx.fillStyle = '#eab308'; drawCtx.fill();
        } else if (d.type === 'angle') {
          drawCtx.beginPath(); drawCtx.moveTo(d.sx, d.sy); drawCtx.lineTo(d.ex-60, d.ey); drawCtx.lineTo(d.ex+60, d.ey); drawCtx.closePath();
          drawCtx.fillStyle = 'rgba(56, 189, 248, 0.4)'; drawCtx.fill(); drawCtx.strokeStyle='#38bdf8'; drawCtx.lineWidth=2; drawCtx.stroke();
        }
      });
    }

    function saveDrawnImage() {
      const c = document.createElement('canvas'); c.width = drawCanvas.width; c.height = drawCanvas.height;
      const cx = c.getContext('2d');
      cx.drawImage(drawVideo, 0, 0, c.width, c.height); cx.drawImage(drawCanvas, 0, 0);
      const a = document.createElement('a'); a.download = `تحليل_رؤية_${Date.now()}.jpg`; a.href = c.toDataURL(); a.click();
    }
  </script>
</body>
</html>
