<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ziada Analysis - استوديو حراس المرمى</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #070b12; --card-bg: #111827; --border-color: #1f2937;
      --primary: #38bdf8; --accent: #f59e0b; --danger: #ef4444; --success: #10b981;
      --text: #f8fafc; --text-muted: #94a3b8; --pitch-green: #15803d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text); padding: 14px; overflow-x: hidden; }
    
    .top-nav { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 20px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 15px; }
    .brand-title { font-size: 1.2rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 10px; }
    .btn-top { background: #1f2937; color: var(--primary); border: 1px solid var(--primary); padding: 7px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; text-decoration: none; }
    
    /* Tabs */
    .tabs-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
    .tab-btn { background: #1f2937; border: 1px solid #374151; color: white; padding: 10px 30px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; font-size: 15px; transition: 0.3s; display: flex; align-items: center; gap: 10px; }
    .tab-btn:hover { border-color: var(--primary); }
    .tab-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* =========================================
       قسم تصميم التدريبات (Drill Builder)
       ========================================= */
    .training-workspace { display: grid; grid-template-columns: 250px 1fr; gap: 15px; align-items: start; height: 75vh; }
    .tools-panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px; height: 100%; overflow-y: auto; }
    .tools-title { color: var(--accent); font-weight: 800; text-align: center; border-bottom: 1px solid #374151; padding-bottom: 10px; margin-bottom: 10px; }
    
    .drill-item-btn { background: #1f2937; border: 1px solid #374151; color: white; padding: 10px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; font-size: 13px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
    .drill-item-btn:hover { background: #374151; border-color: var(--primary); }
    
    .pitch-area { background: var(--pitch-green); border: 2px solid #fff; border-radius: 8px; height: 100%; position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    /* تخطيط منطقة الجزاء */
    .penalty-box { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 60%; height: 50%; border: 2px solid #fff; border-bottom: none; }
    .six-yard-box { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 25%; height: 20%; border: 2px solid #fff; border-bottom: none; }
    .penalty-arc { position: absolute; bottom: 50%; left: 50%; transform: translateX(-50%); width: 20%; height: 20%; border: 2px solid #fff; border-radius: 50%; clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%); }
    .goal-line { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 12%; height: 5px; background: #fff; z-index: 1; }

    /* العناصر القابلة للسحب */
    .draggable-item { position: absolute; cursor: grab; user-select: none; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; font-size: 24px; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5)); transition: transform 0.1s; }
    .draggable-item:active { cursor: grabbing; transform: scale(1.1); }
    .draggable-item .delete-btn { display: none; position: absolute; top: -15px; right: -15px; background: red; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; text-align: center; line-height: 20px; cursor: pointer; border: 1px solid #fff; }
    .draggable-item:hover .delete-btn { display: block; }
    
    .action-bar { padding: 15px 0; display: flex; justify-content: center; gap: 15px; }
    .btn-action { background: var(--primary); color: #000; border: none; padding: 10px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }

    /* =========================================
       قسم تحليل الحراس (Video Analysis)
       ========================================= */
    .analysis-workspace { display: flex; flex-direction: column; gap: 15px; }
    .analysis-toolbar { display: flex; justify-content: center; gap: 10px; background: var(--card-bg); padding: 12px; border-radius: 12px; border: 1px solid var(--border-color); }
    .tool-btn { background: #1f2937; border: 1px solid #374151; color: white; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; font-size: 13px; transition: 0.2s; }
    .tool-btn:hover, .tool-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
    
    .video-canvas-container { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); display: flex; justify-content: center; align-items: center; height: 60vh; }
    video { width: 100%; height: 100%; object-fit: contain; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; z-index: 5; pointer-events: none; }
    canvas.drawing-active { pointer-events: auto; }

    .video-controls { display: flex; justify-content: center; align-items: center; gap: 15px; padding: 10px 0; }
    .upload-input { background: #1f2937; padding: 8px; border-radius: 8px; color: #fff; font-size: 13px; border: 1px solid #374151; }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <header class="top-nav">
      <span class="brand-title"><i class="fa-solid fa-hands-holding-circle"></i> Ziada Analysis | استوديو حراس المرمى (GK)</span>
      <a href="index.html" class="btn-top">لوحة التحكم</a>
    </header>

    <div class="tabs-container">
      <button class="tab-btn active" onclick="switchTab('training')"><i class="fa-solid fa-clipboard-list"></i> لوحة تصميم التدريبات</button>
      <button class="tab-btn" onclick="switchTab('analysis')"><i class="fa-solid fa-video"></i> تحليل أداء الحراس</button>
    </div>

    <!-- التاب الأول: تصميم التدريبات -->
    <div id="trainingTab" class="tab-content active">
      <div class="training-workspace">
        <aside class="tools-panel">
          <div class="tools-title">أدوات التدريب</div>
          <button class="drill-item-btn" onclick="addItem('🧤')"><span>حارس مرمى (GK)</span> <i class="fa-solid fa-hands-holding-circle"></i></button>
          <button class="drill-item-btn" onclick="addItem('⚽')"><span>كرة قدم</span> <i class="fa-solid fa-futbol"></i></button>
          <button class="drill-item-btn" onclick="addItem('🧍')"><span>شاخص (مهاجم)</span> <i class="fa-solid fa-person"></i></button>
          <button class="drill-item-btn" onclick="addItem('🦺')"><span>مدرب حراس</span> <i class="fa-solid fa-user-tie"></i></button>
          <hr style="border-color:#374151;">
          <button class="drill-item-btn" onclick="addItem('🔺')"><span>قمع أحمر</span> <i class="fa-solid fa-caret-up" style="color:#ef4444;"></i></button>
          <button class="drill-item-btn" onclick="addItem('🟡')"><span>ماركر أصفر</span> <i class="fa-solid fa-circle" style="color:#facc15;"></i></button>
          <button class="drill-item-btn" onclick="addItem('🚧')"><span>حاجز تدريب</span> <i class="fa-solid fa-bars-staggered"></i></button>
          <button class="drill-item-btn" onclick="addItem('🥅')"><span>مرمى صغير</span> <i class="fa-solid fa-igloo"></i></button>
        </aside>
        
        <div class="pitch-area" id="pitchArea">
          <div class="penalty-arc"></div>
          <div class="penalty-box"></div>
          <div class="six-yard-box"></div>
          <div class="goal-line"></div>
        </div>
      </div>
      <div class="action-bar">
        <button class="btn-action" onclick="clearPitch()"><i class="fa-solid fa-trash"></i> مسح الملعب</button>
        <button class="btn-action" style="background:var(--success); color:#fff;" onclick="printDrill()"><i class="fa-solid fa-print"></i> حفظ التدريب كصورة</button>
      </div>
    </div>

    <!-- التاب الثاني: تحليل الأداء (فيديو) -->
    <div id="analysisTab" class="tab-content">
      <div class="analysis-workspace">
        <div class="analysis-toolbar">
          <button class="tool-btn active" onclick="setAnalysisTool('none')"><i class="fa-solid fa-mouse-pointer"></i> تشغيل الفيديو</button>
          <button class="tool-btn" onclick="setAnalysisTool('gk-pos')"><i class="fa-solid fa-street-view"></i> تمركز الحارس</button>
          <button class="tool-btn" onclick="setAnalysisTool('ball')"><i class="fa-solid fa-futbol"></i> مكان الكرة</button>
          <button class="tool-btn" onclick="setAnalysisTool('shot-path')"><i class="fa-solid fa-arrow-trend-down"></i> مسار التسديدة</button>
          <button class="tool-btn" style="background:#0ea5e9;" onclick="setAnalysisTool('angle')"><i class="fa-solid fa-draw-polygon"></i> زاوية التغطية (مثلث)</button>
          <button class="tool-btn" onclick="clearAnalysis()" style="background:var(--danger);"><i class="fa-solid fa-trash"></i> مسح الرسم</button>
        </div>

        <div class="video-canvas-container" id="videoContainer">
          <video id="gkVideo" controls playsinline></video>
          <canvas id="gkCanvas"></canvas>
        </div>

        <div class="video-controls">
          <button class="control-btn" onclick="skip(-5)"><i class="fa-solid fa-backward-step"></i> 5ث رجوع</button>
          <button class="control-btn" onclick="skip(5)">5ث تقديم <i class="fa-solid fa-forward-step"></i></button>
          <input type="file" class="upload-input" accept="video/*" onchange="loadGkVideo(event)">
        </div>
      </div>
    </div>

  </div>

  <!-- Html2Canvas لحفظ لوحة التدريب -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    // ==========================================
    // منطق التابات (Tabs Logic)
    // ==========================================
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      event.currentTarget.classList.add('active');
      document.getElementById(tabId + 'Tab').classList.add('active');
    }

    // ==========================================
    // منطق لوحة التدريبات (Drill Builder Drag & Drop)
    // ==========================================
    const pitchArea = document.getElementById('pitchArea');
    let draggedItem = null;
    let offsetX = 0, offsetY = 0;

    function addItem(emoji) {
      const item = document.createElement('div');
      item.className = 'draggable-item';
      item.innerHTML = `${emoji} <div class="delete-btn" onclick="this.parentElement.remove()">X</div>`;
      item.style.left = '50%';
      item.style.top = '50%';
      
      item.addEventListener('mousedown', dragStart);
      pitchArea.appendChild(item);
    }

    function clearPitch() {
      const items = pitchArea.querySelectorAll('.draggable-item');
      items.forEach(item => item.remove());
    }

    function dragStart(e) {
      if(e.target.classList.contains('delete-btn')) return;
      draggedItem = this;
      const rect = draggedItem.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      document.addEventListener('mousemove', dragMove);
      document.addEventListener('mouseup', dragEnd);
    }

    function dragMove(e) {
      if (!draggedItem) return;
      const pitchRect = pitchArea.getBoundingClientRect();
      let newLeft = e.clientX - pitchRect.left - offsetX;
      let newTop = e.clientY - pitchRect.top - offsetY;
      
      draggedItem.style.left = `${newLeft}px`;
      draggedItem.style.top = `${newTop}px`;
    }

    function dragEnd() {
      draggedItem = null;
      document.removeEventListener('mousemove', dragMove);
      document.removeEventListener('mouseup', dragEnd);
    }

    function printDrill() {
      html2canvas(pitchArea, { backgroundColor: '#15803d' }).then(canvas => {
        const link = document.createElement('a');
        link.download = `تدريب_حراس_${Date.now()}.jpg`;
        link.href = canvas.toDataURL('image/jpeg');
        link.click();
      });
    }

    // ==========================================
    // منطق تحليل الفيديو (Video Analysis)
    // ==========================================
    const video = document.getElementById('gkVideo');
    const canvas = document.getElementById('gkCanvas');
    const ctx = canvas.getContext('2d');
    
    let currentGkTool = 'none';
    let drawings = [];
    let isDrawing = false;
    let startX = 0, startY = 0;

    function loadGkVideo(e) {
      if(e.target.files[0]) {
        video.src = URL.createObjectURL(e.target.files[0]);
        video.load();
        
        video.addEventListener('loadedmetadata', () => {
          resizeCanvas();
        });
      }
    }

    function skip(sec) { if(video.src) video.currentTime += sec; }

    function resizeCanvas() {
      const rect = video.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      redrawAnalysis();
    }
    window.addEventListener('resize', resizeCanvas);
    video.addEventListener('play', () => { clearAnalysis(); }); // مسح الرسم لما الفيديو يشتغل

    function setAnalysisTool(tool) {
      currentGkTool = tool;
      document.querySelectorAll('#analysisTab .tool-btn').forEach(btn => btn.classList.remove('active'));
      event.currentTarget.classList.add('active');
      
      if (tool === 'none') {
        canvas.classList.remove('drawing-active');
        video.controls = true;
      } else {
        video.pause();
        canvas.classList.add('drawing-active');
        video.controls = false;
      }
    }

    function clearAnalysis() {
      drawings = [];
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    canvas.addEventListener('mousedown', (e) => {
      if (currentGkTool === 'none') return;
      const pos = getMousePos(e);
      startX = pos.x; startY = pos.y;
      
      if (currentGkTool === 'gk-pos' || currentGkTool === 'ball') {
        drawings.push({ type: currentGkTool, x: startX, y: startY });
        redrawAnalysis();
        setAnalysisTool('none');
      } else {
        isDrawing = true;
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const pos = getMousePos(e);
      redrawAnalysis();
      
      ctx.beginPath();
      if (currentGkTool === 'shot-path') {
        ctx.moveTo(startX, startY);
        ctx.lineTo(pos.x, pos.y);
        ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 4; ctx.stroke();
      } else if (currentGkTool === 'angle') {
        // رسم مثلث من الكورة للقائمين (نقطة البداية هي الكورة، النقطة التانية والتالتة هي الماوس والمسافة بينهم)
        ctx.moveTo(startX, startY);
        ctx.lineTo(pos.x - 60, pos.y); // القائم الأول التخيلي
        ctx.lineTo(pos.x + 60, pos.y); // القائم الثاني التخيلي
        ctx.closePath();
        ctx.fillStyle = 'rgba(56, 189, 248, 0.4)'; ctx.fill();
        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.stroke();
      }
    });

    canvas.addEventListener('mouseup', (e) => {
      if (!isDrawing) return;
      isDrawing = false;
      const pos = getMousePos(e);
      drawings.push({ type: currentGkTool, startX, startY, endX: pos.x, endY: pos.y });
      redrawAnalysis();
      setAnalysisTool('none');
    });

    function redrawAnalysis() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      drawings.forEach(d => {
        if (d.type === 'gk-pos') {
          ctx.beginPath(); ctx.arc(d.x, d.y, 15, 0, Math.PI*2);
          ctx.fillStyle = '#eab308'; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke();
          ctx.fillStyle = '#000'; ctx.font = 'bold 12px Cairo'; ctx.fillText('GK', d.x-10, d.y+4);
        } else if (d.type === 'ball') {
          ctx.beginPath(); ctx.arc(d.x, d.y, 10, 0, Math.PI*2);
          ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='#000'; ctx.stroke();
        } else if (d.type === 'shot-path') {
          // رسم سهم
          const angle = Math.atan2(d.endY - d.startY, d.endX - d.startX);
          ctx.beginPath(); ctx.moveTo(d.startX, d.startY); ctx.lineTo(d.endX, d.endY);
          ctx.lineTo(d.endX - 15 * Math.cos(angle - Math.PI/6), d.endY - 15 * Math.sin(angle - Math.PI/6));
          ctx.moveTo(d.endX, d.endY); ctx.lineTo(d.endX - 15 * Math.cos(angle + Math.PI/6), d.endY - 15 * Math.sin(angle + Math.PI/6));
          ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 4; ctx.stroke();
        } else if (d.type === 'angle') {
          ctx.beginPath(); ctx.moveTo(d.startX, d.startY);
          ctx.lineTo(d.endX - 60, d.endY); ctx.lineTo(d.endX + 60, d.endY);
          ctx.closePath(); ctx.fillStyle = 'rgba(56, 189, 248, 0.4)'; ctx.fill();
          ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.stroke();
        }
      });
    }
  </script>
</body>
</html>
