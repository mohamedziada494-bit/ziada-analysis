<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ziada Analysis - استوديو حراس المرمى (TacticalPad)</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #070b12; --card-bg: #111827; --border-color: #1f2937;
      --primary: #38bdf8; --accent: #f59e0b; --danger: #ef4444; --success: #10b981;
      --text: #f8fafc; --text-muted: #94a3b8; --pitch-green: #15803d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text); padding: 14px; overflow-x: hidden; }
    
    .top-nav { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 20px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 15px; }
    .brand-title { font-size: 1.2rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 10px; }
    .btn-top { background: #1f2937; color: var(--primary); border: 1px solid var(--primary); padding: 7px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; text-decoration: none; }
    
    .tabs-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
    .tab-btn { background: #1f2937; border: 1px solid #374151; color: white; padding: 10px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.3s; display: flex; align-items: center; gap: 10px; }
    .tab-btn:hover { border-color: var(--primary); }
    .tab-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* =========================================
       قسم تصميم التدريبات (TacticalPad Builder)
       ========================================= */
    .training-workspace { display: grid; grid-template-columns: 220px 1fr; gap: 15px; align-items: start; height: 70vh; }
    .tools-panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px; height: 100%; overflow-y: auto; user-select: none; }
    .tools-title { color: var(--accent); font-weight: 800; text-align: center; border-bottom: 1px solid #374151; padding-bottom: 10px; margin-bottom: 10px; }
    
    .draggable-source { background: #1f2937; border: 1px solid #374151; color: white; padding: 10px; border-radius: 8px; cursor: grab; font-weight: bold; font-size: 13px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
    .draggable-source:hover { background: #374151; border-color: var(--primary); }
    .draggable-source:active { cursor: grabbing; }

    /* الملعب وإعدادات الرؤية */
    .pitch-container { display: flex; flex-direction: column; gap: 10px; height: 100%; }
    .pitch-controls { display: flex; justify-content: center; gap: 10px; background: var(--card-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); }
    .pitch-btn { background: #1f2937; color: #fff; border: 1px solid #374151; padding: 6px 15px; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; }
    .pitch-btn.active { background: var(--primary); color: #000; }
    
    .pitch-area { background: var(--pitch-green); border: 2px solid #fff; border-radius: 8px; flex: 1; position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    
    /* تخطيطات الملعب المتغيرة */
    .pitch-lines { position: absolute; width: 100%; height: 100%; pointer-events: none; transition: all 0.3s; }
    /* عرض منطقة الجزاء */
    .view-penalty .penalty-box { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 60%; height: 50%; border: 2px solid #fff; border-bottom: none; }
    .view-penalty .six-yard-box { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 25%; height: 20%; border: 2px solid #fff; border-bottom: none; }
    .view-penalty .penalty-arc { position: absolute; bottom: 50%; left: 50%; transform: translateX(-50%); width: 20%; height: 20%; border: 2px solid #fff; border-radius: 50%; clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%); }
    .view-penalty .goal-net { display: none; }
    
    /* عرض الـ 6 ياردة والتلات خشبات */
    .view-six-yard .penalty-box { display: none; }
    .view-six-yard .penalty-arc { display: none; }
    .view-six-yard .six-yard-box { position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%); width: 70%; height: 60%; border: 3px solid #fff; border-bottom: none; }
    .view-six-yard .goal-net { display: block; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 35%; height: 15%; border: 4px solid #eab308; border-bottom: none; background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.3) 10px, rgba(255,255,255,0.3) 12px), repeating-linear-gradient(-45deg, transparent, transparent 10px, rgba(255,255,255,0.3) 10px, rgba(255,255,255,0.3) 12px); box-shadow: inset 0 10px 20px rgba(0,0,0,0.5); }

    /* العناصر القابلة للسحب والتحجيم داخل الملعب */
    .drill-item { position: absolute; cursor: grab; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5)); transform-origin: center; transition: top 0.5s ease-in-out, left 0.5s ease-in-out; }
    .drill-item:active { cursor: grabbing; }
    .drill-item .delete-btn { display: none; position: absolute; top: -15px; right: -15px; background: red; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; text-align: center; line-height: 20px; cursor: pointer; border: 1px solid #fff; }
    .drill-item:hover .delete-btn { display: block; }
    .drill-item.animating { transition: top 1s linear, left 1s linear; }

    /* شريط تسجيل الحركة (Animation Timeline) */
    .anim-bar { background: #111827; border: 1px solid var(--border-color); padding: 10px 20px; border-radius: 8px; display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 10px; }
    .anim-btn { background: #374151; color: #fff; border: 1px solid #4b5563; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px;}
    .anim-btn:hover { background: #4b5563; }
    .anim-btn.record { background: #0ea5e9; color: #000; border-color: #0284c7; }
    .anim-btn.play { background: #10b981; color: #000; border-color: #059669; }
    .frames-count { font-size: 14px; font-weight: bold; color: var(--primary); background: #1f2937; padding: 5px 10px; border-radius: 4px;}

    .action-bar { padding: 15px 0; display: flex; justify-content: center; gap: 15px; }
    .btn-action { background: var(--primary); color: #000; border: none; padding: 10px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }

    /* =========================================
       قسم تحليل الحراس (Video Analysis) - بدون تغيير
       ========================================= */
    .analysis-workspace { display: flex; flex-direction: column; gap: 15px; }
    .analysis-toolbar { display: flex; justify-content: center; gap: 10px; background: var(--card-bg); padding: 12px; border-radius: 12px; border: 1px solid var(--border-color); }
    .tool-btn { background: #1f2937; border: 1px solid #374151; color: white; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; font-size: 13px; transition: 0.2s; }
    .tool-btn:hover, .tool-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
    .video-canvas-container { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); display: flex; justify-content: center; align-items: center; height: 60vh; }
    video { width: 100%; height: 100%; object-fit: contain; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; z-index: 5; pointer-events: none; }
    canvas.drawing-active { pointer-events: auto; }
    .video-controls { display: flex; justify-content: center; align-items: center; gap: 15px; padding: 10px 0; }
    .upload-input { background: #1f2937; padding: 8px; border-radius: 8px; color: #fff; font-size: 13px; border: 1px solid #374151; }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <header class="top-nav">
      <span class="brand-title"><i class="fa-solid fa-hands-holding-circle"></i> Ziada Analysis | استوديو حراس المرمى (TacticalPad)</span>
      <a href="index.html" class="btn-top">لوحة التحكم</a>
    </header>

    <div class="tabs-container">
      <button class="tab-btn active" onclick="switchTab('training')"><i class="fa-solid fa-clipboard-list"></i> محاكي التدريبات والتكتيك</button>
      <button class="tab-btn" onclick="switchTab('analysis')"><i class="fa-solid fa-video"></i> تحليل أداء الحراس (فيديو)</button>
    </div>

    <!-- التاب الأول: تصميم التدريبات (محاكي الحركة) -->
    <div id="trainingTab" class="tab-content active">
      <div class="training-workspace">
        <aside class="tools-panel">
          <div class="tools-title">الأدوات (اسحب للملعب)</div>
          <div style="font-size: 11px; text-align: center; color: var(--text-muted); margin-bottom: 5px;">* استخدم بكرة الماوس للتكبير والتصغير</div>
          
          <div class="draggable-source" draggable="true" data-type="gk">
            <span>حارس مرمى</span>
            <svg width="24" height="24" viewBox="0 0 100 100"><circle cx="50" cy="50" r="25" fill="#eab308"/><circle cx="15" cy="50" r="15" fill="#fff" stroke="#000" stroke-width="3"/><circle cx="85" cy="50" r="15" fill="#fff" stroke="#000" stroke-width="3"/></svg>
          </div>
          <div class="draggable-source" draggable="true" data-type="player_red">
            <span>مهاجم (أحمر)</span>
            <svg width="24" height="24" viewBox="0 0 100 100"><circle cx="50" cy="50" r="25" fill="#ef4444"/><path d="M 25 50 Q 50 10 75 50" fill="none" stroke="#fff" stroke-width="4"/></svg>
          </div>
          <div class="draggable-source" draggable="true" data-type="player_blue">
            <span>مدافع (أزرق)</span>
            <svg width="24" height="24" viewBox="0 0 100 100"><circle cx="50" cy="50" r="25" fill="#3b82f6"/><path d="M 25 50 Q 50 10 75 50" fill="none" stroke="#fff" stroke-width="4"/></svg>
          </div>
          <div class="draggable-source" draggable="true" data-type="ball">
            <span>كرة قدم</span>
            <svg width="20" height="20" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#fff" stroke="#000" stroke-width="4"/><polygon points="50,20 75,40 65,70 35,70 25,40" fill="#000"/></svg>
          </div>
          <hr style="border-color:#374151;">
          <div class="draggable-source" draggable="true" data-type="cone">
            <span>قمع أحمر</span>
            <svg width="20" height="20" viewBox="0 0 100 100"><polygon points="50,10 90,90 10,90" fill="#ef4444" stroke="#fff" stroke-width="2"/></svg>
          </div>
          <div class="draggable-source" draggable="true" data-type="hurdle">
            <span>حاجز تدريب</span>
            <svg width="30" height="15" viewBox="0 0 100 50"><rect x="10" y="10" width="80" height="10" fill="#facc15"/><rect x="15" y="20" width="10" height="30" fill="#000"/><rect x="75" y="20" width="10" height="30" fill="#000"/></svg>
          </div>
        </aside>
        
        <div class="pitch-container">
          <div class="pitch-controls">
            <button class="pitch-btn active" onclick="setPitchView('penalty')">منطقة الجزاء (كاملة)</button>
            <button class="pitch-btn" onclick="setPitchView('six-yard')">منطقة الـ 6 والمرمى (التلات خشبات)</button>
          </div>
          
          <div class="pitch-area view-penalty" id="pitchArea" ondrop="drop(event)" ondragover="allowDrop(event)">
            <div class="pitch-lines">
              <div class="penalty-arc"></div>
              <div class="penalty-box"></div>
              <div class="six-yard-box"></div>
              <div class="goal-net"></div>
            </div>
            <!-- سيتم وضع الأدوات هنا -->
          </div>
        </div>
      </div>
      
      <!-- شريط التحريك (Animation Timeline) -->
      <div class="anim-bar">
        <span style="color:#cbd5e1; font-weight:bold;"><i class="fa-solid fa-film"></i> محرك الحركة:</span>
        <button class="anim-btn record" onclick="saveFrame()"><i class="fa-solid fa-camera"></i> حفظ لقطة (إطار)</button>
        <span class="frames-count">عدد اللقطات: <span id="frameCount">0</span></span>
        <button class="anim-btn play" onclick="playAnimation()"><i class="fa-solid fa-play"></i> تشغيل التحرك</button>
        <button class="anim-btn" style="background:#ef4444; border-color:#b91c1c;" onclick="clearFrames()"><i class="fa-solid fa-trash-can"></i> مسح الحركة</button>
      </div>

      <div class="action-bar">
        <button class="btn-action" style="background:#4b5563; color:#fff;" onclick="clearPitch()"><i class="fa-solid fa-broom"></i> تنظيف الملعب</button>
        <button class="btn-action" style="background:var(--success); color:#fff;" onclick="printDrill()"><i class="fa-solid fa-print"></i> حفظ التدريب كصورة</button>
      </div>
    </div>

    <!-- التاب الثاني: تحليل الأداء (فيديو) -->
    <div id="analysisTab" class="tab-content">
      <div class="analysis-workspace">
        <div class="analysis-toolbar">
          <button class="tool-btn active" onclick="setAnalysisTool('none')"><i class="fa-solid fa-mouse-pointer"></i> تشغيل الفيديو</button>
          <button class="tool-btn" onclick="setAnalysisTool('gk-pos')"><i class="fa-solid fa-street-view"></i> تمركز الحارس</button>
          <button class="tool-btn" onclick="setAnalysisTool('ball')"><i class="fa-solid fa-futbol"></i> مكان الكرة</button>
          <button class="tool-btn" onclick="setAnalysisTool('shot-path')"><i class="fa-solid fa-arrow-trend-down"></i> مسار التسديدة</button>
          <button class="tool-btn" style="background:#0ea5e9;" onclick="setAnalysisTool('angle')"><i class="fa-solid fa-draw-polygon"></i> زاوية التغطية (مثلث)</button>
          <button class="tool-btn" onclick="clearAnalysis()" style="background:var(--danger);"><i class="fa-solid fa-trash"></i> مسح الرسم</button>
        </div>

        <div class="video-canvas-container" id="videoContainer">
          <video id="gkVideo" controls playsinline></video>
          <canvas id="gkCanvas"></canvas>
        </div>

        <div class="video-controls">
          <button class="control-btn" onclick="skip(-5)"><i class="fa-solid fa-backward-step"></i> 5ث رجوع</button>
          <button class="control-btn" onclick="skip(5)">5ث تقديم <i class="fa-solid fa-forward-step"></i></button>
          <input type="file" class="upload-input" accept="video/*" onchange="loadGkVideo(event)">
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      event.currentTarget.classList.add('active');
      document.getElementById(tabId + 'Tab').classList.add('active');
    }

    // ==========================================
    // منطق لوحة التدريبات والتحريك (Drill Builder & Animation)
    // ==========================================
    const pitchArea = document.getElementById('pitchArea');
    let draggedType = null;
    let itemIdCounter = 0;
    
    // إعداد السحب من القائمة
    document.querySelectorAll('.draggable-source').forEach(el => {
      el.addEventListener('dragstart', (e) => {
        draggedType = e.target.closest('.draggable-source').dataset.type;
        e.dataTransfer.setData('text/plain', ''); // ضروري للفايرفوكس
      });
    });

    function allowDrop(e) { e.preventDefault(); }
    
    function drop(e) {
      e.preventDefault();
      if (!draggedType) return;
      
      const rect = pitchArea.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      createDrillItem(draggedType, x, y);
      draggedType = null;
    }

    // قواميس أشكال الـ SVG
    const svgShapes = {
      'gk': `<svg width="40" height="40" viewBox="0 0 100 100"><circle cx="50" cy="50" r="25" fill="#eab308"/><circle cx="15" cy="50" r="15" fill="#fff" stroke="#000" stroke-width="3"/><circle cx="85" cy="50" r="15" fill="#fff" stroke="#000" stroke-width="3"/></svg>`,
      'player_red': `<svg width="35" height="35" viewBox="0 0 100 100"><circle cx="50" cy="50" r="25" fill="#ef4444"/><path d="M 25 50 Q 50 10 75 50" fill="none" stroke="#fff" stroke-width="4"/></svg>`,
      'player_blue': `<svg width="35" height="35" viewBox="0 0 100 100"><circle cx="50" cy="50" r="25" fill="#3b82f6"/><path d="M 25 50 Q 50 10 75 50" fill="none" stroke="#fff" stroke-width="4"/></svg>`,
      'ball': `<svg width="25" height="25" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#fff" stroke="#000" stroke-width="4"/><polygon points="50,20 75,40 65,70 35,70 25,40" fill="#000"/></svg>`,
      'cone': `<svg width="25" height="25" viewBox="0 0 100 100"><polygon points="50,10 90,90 10,90" fill="#ef4444" stroke="#fff" stroke-width="2"/></svg>`,
      'hurdle': `<svg width="40" height="20" viewBox="0 0 100 50"><rect x="10" y="10" width="80" height="10" fill="#facc15"/><rect x="15" y="20" width="10" height="30" fill="#000"/><rect x="75" y="20" width="10" height="30" fill="#000"/></svg>`
    };

    function createDrillItem(type, x, y) {
      itemIdCounter++;
      const item = document.createElement('div');
      item.className = 'drill-item';
      item.id = `item_${itemIdCounter}`;
      item.innerHTML = `${svgShapes[type]} <div class="delete-btn" onclick="this.parentElement.remove()">X</div>`;
      
      // توسيط العنصر حول الماوس
      item.style.left = `${x}px`;
      item.style.top = `${y}px`;
      item.style.transform = `translate(-50%, -50%) scale(1)`;
      item.dataset.scale = 1;
      
      // أحداث التحريك جوه الملعب
      item.addEventListener('mousedown', pitchItemDragStart);
      // حدث التكبير والتصغير (Scroll)
      item.addEventListener('wheel', (e) => {
        e.preventDefault();
        let scale = parseFloat(item.dataset.scale);
        scale += e.deltaY < 0 ? 0.1 : -0.1;
        if(scale < 0.3) scale = 0.3;
        if(scale > 3) scale = 3;
        item.dataset.scale = scale;
        item.style.transform = `translate(-50%, -50%) scale(${scale})`;
      });

      pitchArea.appendChild(item);
    }

    // منطق سحب العناصر جوه الملعب
    let activeItem = null;
    let offsetX = 0, offsetY = 0;

    function pitchItemDragStart(e) {
      if(e.target.classList.contains('delete-btn')) return;
      activeItem = this;
      activeItem.style.zIndex = 100;
      
      const rect = activeItem.getBoundingClientRect();
      const pitchRect = pitchArea.getBoundingClientRect();
      
      offsetX = e.clientX - rect.left - (rect.width/2);
      offsetY = e.clientY - rect.top - (rect.height/2);
      
      document.addEventListener('mousemove', pitchItemDragMove);
      document.addEventListener('mouseup', pitchItemDragEnd);
    }

    function pitchItemDragMove(e) {
      if (!activeItem) return;
      const pitchRect = pitchArea.getBoundingClientRect();
      let x = e.clientX - pitchRect.left - offsetX;
      let y = e.clientY - pitchRect.top - offsetY;
      
      activeItem.style.left = `${x}px`;
      activeItem.style.top = `${y}px`;
    }

    function pitchItemDragEnd() {
      if(activeItem) activeItem.style.zIndex = 10;
      activeItem = null;
      document.removeEventListener('mousemove', pitchItemDragMove);
      document.removeEventListener('mouseup', pitchItemDragEnd);
    }

    function setPitchView(view) {
      document.querySelectorAll('.pitch-btn').forEach(btn => btn.classList.remove('active'));
      event.currentTarget.classList.add('active');
      pitchArea.className = `pitch-area view-${view}`;
    }

    function clearPitch() {
      pitchArea.querySelectorAll('.drill-item').forEach(item => item.remove());
      clearFrames();
    }

    function printDrill() {
      html2canvas(pitchArea, { backgroundColor: '#15803d' }).then(canvas => {
        const link = document.createElement('a');
        link.download = `خطة_التدريب_${Date.now()}.jpg`;
        link.href = canvas.toDataURL('image/jpeg');
        link.click();
      });
    }

    // ==========================================
    // محرك الأنيميشن (TacticalPad Animation)
    // ==========================================
    let frames = [];
    
    function saveFrame() {
      const currentPositions = [];
      document.querySelectorAll('.drill-item').forEach(item => {
        currentPositions.push({
          id: item.id,
          left: item.style.left,
          top: item.style.top
        });
      });
      frames.push(currentPositions);
      document.getElementById('frameCount').innerText = frames.length;
    }

    function clearFrames() {
      frames = [];
      document.getElementById('frameCount').innerText = "0";
    }

    async function playAnimation() {
      if (frames.length === 0) return alert("قم بتحريك اللاعبين واضغط على 'حفظ لقطة' أولاً لإنشاء الحركة!");
      
      // إرجاع كل العناصر لموقعها في الإطار الأول بدون نعومة
      document.querySelectorAll('.drill-item').forEach(item => item.classList.remove('animating'));
      applyFrame(frames[0]);
      
      // تأخير بسيط قبل بدأ التحريك
      await new Promise(r => setTimeout(r, 500));

      // تشغيل باقي الإطارات بنعومة
      for (let i = 1; i < frames.length; i++) {
        document.querySelectorAll('.drill-item').forEach(item => item.classList.add('animating'));
        applyFrame(frames[i]);
        await new Promise(r => setTimeout(r, 1000)); // مدة الحركة بين كل فريم
      }
      
      setTimeout(() => {
        document.querySelectorAll('.drill-item').forEach(item => item.classList.remove('animating'));
      }, 500);
    }

    function applyFrame(frameData) {
      frameData.forEach(pos => {
        const item = document.getElementById(pos.id);
        if (item) {
          item.style.left = pos.left;
          item.style.top = pos.top;
        }
      });
    }

    // ==========================================
    // منطق تحليل الفيديو (بدون تغيير)
    // ==========================================
    const video = document.getElementById('gkVideo');
    const canvas = document.getElementById('gkCanvas');
    const ctx = canvas.getContext('2d');
    let currentGkTool = 'none'; let drawings = []; let isDrawing = false; let startX = 0, startY = 0;

    function loadGkVideo(e) { if(e.target.files[0]) { video.src = URL.createObjectURL(e.target.files[0]); video.load(); video.addEventListener('loadedmetadata', resizeCanvas); } }
    function skip(sec) { if(video.src) video.currentTime += sec; }
    function resizeCanvas() { const rect = video.getBoundingClientRect(); canvas.width = rect.width; canvas.height = rect.height; redrawAnalysis(); }
    window.addEventListener('resize', resizeCanvas);
    video.addEventListener('play', () => { clearAnalysis(); });

    function setAnalysisTool(tool) {
      currentGkTool = tool;
      document.querySelectorAll('#analysisTab .tool-btn').forEach(btn => btn.classList.remove('active'));
      event.currentTarget.classList.add('active');
      if (tool === 'none') { canvas.classList.remove('drawing-active'); video.controls = true; } 
      else { video.pause(); canvas.classList.add('drawing-active'); video.controls = false; }
    }

    function clearAnalysis() { drawings = []; ctx.clearRect(0, 0, canvas.width, canvas.height); }
    function getAnalysisMousePos(e) { const rect = canvas.getBoundingClientRect(); return { x: e.clientX - rect.left, y: e.clientY - rect.top }; }

    canvas.addEventListener('mousedown', (e) => {
      if (currentGkTool === 'none') return;
      const pos = getAnalysisMousePos(e); startX = pos.x; startY = pos.y;
      if (currentGkTool === 'gk-pos' || currentGkTool === 'ball') { drawings.push({ type: currentGkTool, x: startX, y: startY }); redrawAnalysis(); setAnalysisTool('none'); } 
      else { isDrawing = true; }
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const pos = getAnalysisMousePos(e); redrawAnalysis();
      ctx.beginPath();
      if (currentGkTool === 'shot-path') {
        ctx.moveTo(startX, startY); ctx.lineTo(pos.x, pos.y); ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 4; ctx.stroke();
      } else if (currentGkTool === 'angle') {
        ctx.moveTo(startX, startY); ctx.lineTo(pos.x - 60, pos.y); ctx.lineTo(pos.x + 60, pos.y); ctx.closePath();
        ctx.fillStyle = 'rgba(56, 189, 248, 0.4)'; ctx.fill(); ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.stroke();
      }
    });

    canvas.addEventListener('mouseup', (e) => {
      if (!isDrawing) return; isDrawing = false; const pos = getAnalysisMousePos(e);
      drawings.push({ type: currentGkTool, startX, startY, endX: pos.x, endY: pos.y }); redrawAnalysis(); setAnalysisTool('none');
    });

    function redrawAnalysis() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawings.forEach(d => {
        if (d.type === 'gk-pos') {
          ctx.beginPath(); ctx.arc(d.x, d.y, 15, 0, Math.PI*2); ctx.fillStyle = '#eab308'; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke();
          ctx.fillStyle = '#000'; ctx.font = 'bold 12px Cairo'; ctx.fillText('GK', d.x-10, d.y+4);
        } else if (d.type === 'ball') {
          ctx.beginPath(); ctx.arc(d.x, d.y, 10, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='#000'; ctx.stroke();
        } else if (d.type === 'shot-path') {
          const angle = Math.atan2(d.endY - d.startY, d.endX - d.startX);
          ctx.beginPath(); ctx.moveTo(d.startX, d.startY); ctx.lineTo(d.endX, d.endY);
          ctx.lineTo(d.endX - 15 * Math.cos(angle - Math.PI/6), d.endY - 15 * Math.sin(angle - Math.PI/6));
          ctx.moveTo(d.endX, d.endY); ctx.lineTo(d.endX - 15 * Math.cos(angle + Math.PI/6), d.endY - 15 * Math.sin(angle + Math.PI/6));
          ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 4; ctx.stroke();
        } else if (d.type === 'angle') {
          ctx.beginPath(); ctx.moveTo(d.startX, d.startY); ctx.lineTo(d.endX - 60, d.endY); ctx.lineTo(d.endX + 60, d.endY);
          ctx.closePath(); ctx.fillStyle = 'rgba(56, 189, 248, 0.4)'; ctx.fill(); ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.stroke();
        }
      });
    }
  </script>
</body>
</html>
