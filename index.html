<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ziada Analysis - منصة التحليل التكتيكي</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    :root { --primary: #38bdf8; --accent: #f59e0b; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      
      /* 🔴 الصورة تملى الشاشة كلها كخلفية 🔴 */
      background-image: url('logo-bg.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* 🔴 طبقة تغميق شفافة فوق الصورة عشان كلام الكارد يوضح 🔴 */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 8, 15, 0.75);
      z-index: 0;
    }

    .main-card {
      position: relative;
      z-index: 1;
      width: 100%; max-width: 500px;
      background-color: rgba(15, 23, 42, 0.88); /* خلفية الكارد شفافة وأنيقة */
      border: 1px solid rgba(51, 65, 85, 0.8);
      border-radius: 1.25rem; padding: 2.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
    }

    .header { text-align: center; margin-bottom: 1.75rem; }
    .header .logo-text { font-size: 1.8rem; font-weight: 800; color: #ffffff; }
    .header .logo-text span { color: var(--accent); }
    .header p { font-size: 0.9rem; color: #94a3b8; margin-top: 0.35rem; }

    .download-strip { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; background-color: rgba(15, 23, 42, 0.9); padding: 0.6rem; border-radius: 0.75rem; border: 1px solid #334155; }
    .download-strip button { 
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.5rem; 
      padding: 0.6rem; font-size: 0.85rem; font-weight: 700; 
      border-radius: 0.5rem; border: none; cursor: not-allowed; opacity: 0.75;
      background-color: #1e293b; color: #4ade80; 
    }

    .tabs { display: flex; background-color: rgba(15, 23, 42, 0.9); padding: 0.25rem; border-radius: 0.5rem; margin-bottom: 1.5rem; }
    .tab-btn { flex: 1; padding: 0.65rem; border: none; background: transparent; color: #94a3b8; font-size: 0.9rem; font-weight: 600; border-radius: 0.375rem; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background-color: #2563eb; color: #ffffff; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.875rem; font-weight: 600; color: #cbd5e1; margin-bottom: 0.4rem; }
    .form-group input { width: 100%; padding: 0.75rem; background-color: rgba(15, 23, 42, 0.9); border: 1px solid #334155; border-radius: 0.5rem; color: #f8fafc; text-align: left;}
    .submit-btn { width: 100%; padding: 0.8rem; background-color: #2563eb; color: #ffffff; border: none; border-radius: 0.5rem; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 0.5rem; }
    .btn-register-style { background-color: #10b981; }
    .alert { padding: 0.75rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; margin-bottom: 1.25rem; display: none; text-align: center; }
    .alert.error { background-color: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; }
    .alert.success { background-color: rgba(34, 197, 94, 0.15); border: 1px solid #22c55e; color: #86efac; }
    
    .dashboard-panel { display: none; }
    .coach-welcome { text-align: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid #334155; }
    .coach-welcome h2 { font-size: 1.3rem; color: #38bdf8; }
    .analysis-grid { display: flex; flex-direction: column; gap: 1rem; }
    .analysis-card { display: flex; align-items: center; gap: 1rem; padding: 1.1rem; background-color: rgba(15, 23, 42, 0.9); border: 1px solid #334155; border-radius: 0.75rem; text-decoration: none; color: #f8fafc; cursor: pointer; transition: 0.2s; }
    .analysis-card:hover { background-color: #1e293b; border-color: #475569; }
    .analysis-card .icon-box { width: 48px; height: 48px; border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
    .tactical-icon { background: rgba(37, 99, 235, 0.2); color: #60a5fa; }
    .individual-icon { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .live-icon { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .admin-icon { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .logout-btn { width: 100%; padding: 0.65rem; background-color: transparent; border: 1px solid #475569; color: #94a3b8; border-radius: 0.5rem; cursor: pointer; margin-top: 1.5rem; }
  </style>
</head>
<body>

  <div class="main-card">
    <div class="header">
      <div class="logo-text">Ziada <span>Analysis</span></div>
      <p>منصة التحليل الفني والتكتيكي للمباريات</p>
    </div>

    <div class="download-strip">
      <button disabled>📱 تطبيق الموبايل (قريباً... SOOON)</button>
    </div>

    <div id="auth-panel">
      <div class="tabs">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">تسجيل الدخول</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">تسجيل مدرب جديد</button>
      </div>

      <div id="alert-box" class="alert"></div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="login-email" required dir="ltr"></div>
        <div class="form-group"><label>كلمة المرور</label><input type="password" id="login-password" required dir="ltr"></div>
        <button type="submit" class="submit-btn" id="login-btn-text">دخول للمنصة</button>
      </form>

      <form id="register-form" style="display: none;" onsubmit="handleRegister(event)">
        <div class="form-group"><label>اسم المدرب الكامل</label><input type="text" id="reg-name" required></div>
        <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="reg-email" required dir="ltr"></div>
        <div class="form-group"><label>كلمة المرور (6 حروف أو أرقام)</label><input type="password" id="reg-password" required minlength="6" dir="ltr"></div>
        <button type="submit" class="submit-btn btn-register-style" id="reg-btn-text">إنشاء الحساب الآن</button>
      </form>
    </div>

    <div id="dashboard-panel" class="dashboard-panel">
      <div class="coach-welcome"><h2 id="welcome-name">أهلاً بك</h2><p>اختر أداة التحليل:</p></div>
      <div class="analysis-grid">
        <a href="tactical.html" class="analysis-card"><div class="icon-box tactical-icon">📋</div><div class="card-info"><h3>التحليل التكتيكي</h3></div></a>
        <a href="individual.html" class="analysis-card"><div class="icon-box individual-icon">🎯</div><div class="card-info"><h3>التحليل الفردي</h3></div></a>
        <a href="live.html" class="analysis-card"><div class="icon-box live-icon">⏱️</div><div class="card-info"><h3>التحليل المباشر</h3></div></a>
        <a href="admin.html" id="admin-card" class="analysis-card" style="display: none; border-color: #d97706;"><div class="icon-box admin-icon">⚙️</div><div class="card-info"><h3 style="color: #fbbf24;">لوحة تحكم الإدارة</h3></div></a>
      </div>
      <button class="logout-btn" onclick="handleLogout()">تسجيل الخروج</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCvhDAm6YtDvmj6D7q-SyJakij9gDSe3o4",
      authDomain: "ziada-analysis-82e34.firebaseapp.com",
      projectId: "ziada-analysis-82e34",
      storageBucket: "ziada-analysis-82e34.firebasestorage.app",
      messagingSenderId: "763163562341",
      appId: "1:763163562341:web:a4ca77775d3ea05a0b518c"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth(); const db = firebase.firestore();

    let isRegistering = false; 

    function getDeviceFingerprint() {
      let deviceId = localStorage.getItem('ziada_device_id');
      if (!deviceId) { deviceId = 'dev_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now(); localStorage.setItem('ziada_device_id', deviceId); }
      return deviceId;
    }

    async function getGlobalInternetDate() {
      try {
        const response = await fetch('http://worldtimeapi.org/api/timezone/Etc/UTC');
        const data = await response.json();
        return data.datetime.split('T')[0];
      } catch (error) {
        return new Date().toISOString().split('T')[0];
      }
    }

    async function validateUserAccess(user, userData) {
      if (isRegistering) return; 
      if (userData.role !== 'admin' && !user.emailVerified) { showAlert('برجاء تفعيل بريدك الإلكتروني أولاً عبر الرابط المرسل إليك.', 'error'); return false; }
      if (userData.status === 'pending' && userData.role !== 'admin') { showAlert('حسابك قيد المراجعة. يرجى انتظار موافقة المدير الفني.', 'error'); return false; }
      if (userData.role !== 'admin' && userData.subscriptionEnd && userData.subscriptionEnd !== 'unlimited') {
        const trueToday = await getGlobalInternetDate();
        if (trueToday > userData.subscriptionEnd) {
          showAlert('عفواً، لقد انتهت مدة اشتراكك. يرجى التواصل مع الإدارة للتجديد.', 'error'); return false;
        }
      }
      if (userData.role !== 'admin' && userData.status === 'approved' && !userData.allowMultiDevice) {
        const currentLocalDevice = getDeviceFingerprint();
        if (!userData.currentDeviceId) {
          await db.collection('users').doc(user.uid).update({ currentDeviceId: currentLocalDevice });
        } else if (userData.currentDeviceId !== currentLocalDevice) {
          showAlert('عفواً، غير مسموح لك بتسجيل الدخول من أكثر من جهاز في نفس الوقت.', 'error'); return false;
        }
      }
      return true;
    }

    auth.onAuthStateChanged(async (user) => {
      if (isRegistering) return; 
      if (user) {
        try {
          const userDoc = await db.collection('users').doc(user.uid).get();
          if (userDoc.exists) {
            const userData = userDoc.data();
            const isValid = await validateUserAccess(user, userData);
            if (isValid) { localStorage.setItem('ziada_active_user', JSON.stringify(userData)); showDashboard(userData); } 
            else { await auth.signOut(); showAuthPanel(); }
          } else { await auth.signOut(); showAuthPanel(); }
        } catch (error) { showAlert('حدث خطأ أثناء جلب البيانات.', 'error'); }
      } else { showAuthPanel(); }
    });

    function showAuthPanel() { document.getElementById('auth-panel').style.display = 'block'; document.getElementById('dashboard-panel').style.display = 'none'; }
    function showDashboard(user) { document.getElementById('auth-panel').style.display = 'none'; document.getElementById('dashboard-panel').style.display = 'block'; document.getElementById('welcome-name').textContent = `أهلاً بك: ${user.name}`; document.getElementById('admin-card').style.display = user.role === 'admin' ? 'flex' : 'none'; }
    function handleLogout() { auth.signOut().then(() => { localStorage.removeItem('ziada_active_user'); showAuthPanel(); document.getElementById('login-form').reset(); }); }
    function showAlert(message, type) { const box = document.getElementById('alert-box'); box.textContent = message; box.className = `alert ${type}`; box.style.display = 'block'; setTimeout(() => box.style.display = 'none', 5000); }
    function switchTab(type) { const isLogin = type === 'login'; document.getElementById('login-form').style.display = isLogin ? 'block' : 'none'; document.getElementById('register-form').style.display = isLogin ? 'none' : 'block'; document.getElementById('tab-login').classList.toggle('active', isLogin); document.getElementById('tab-register').classList.toggle('active', !isLogin); document.getElementById('alert-box').style.display = 'none'; }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn-text'); btn.textContent = 'جاري التحقق...';
      try { await auth.signInWithEmailAndPassword(document.getElementById('login-email').value, document.getElementById('login-password').value); } 
      catch (error) { showAlert('البريد أو كلمة المرور غير صحيحة.', 'error'); } 
      finally { btn.textContent = 'دخول للمنصة'; }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('reg-btn-text'); 
      btn.textContent = 'جاري إنشاء الحساب...';
      isRegistering = true; 
      let createdUser = null; 

      try {
        const cred = await auth.createUserWithEmailAndPassword(document.getElementById('reg-email').value, document.getElementById('reg-password').value);
        createdUser = cred.user;
        await db.collection('users').doc(createdUser.uid).set({
          uid: createdUser.uid, name: document.getElementById('reg-name').value, email: document.getElementById('reg-email').value,
          role: 'coach', status: 'pending', createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        await createdUser.sendEmailVerification();
        showAlert('تم الإنشاء بنجاح! برجاء مراجعة بريدك الإلكتروني والضغط على رابط التفعيل أولاً.', 'success');
        document.getElementById('register-form').reset();
        await auth.signOut();
        setTimeout(() => switchTab('login'), 4000);
      } catch (error) {
        if (createdUser && error.code !== 'auth/email-already-in-use' && error.code !== 'auth/weak-password') {
          try { await createdUser.delete(); } catch(e) { }
        }
        if (error.code === 'auth/email-already-in-use') showAlert('هذا البريد مستخدم بالفعل.', 'error');
        else if (error.code === 'auth/weak-password') showAlert('كلمة المرور يجب أن تكون 6 أحرف على الأقل.', 'error');
        else showAlert('حدث خطأ أثناء التسجيل: ' + error.message, 'error');
        await auth.signOut();
      } finally { 
        isRegistering = false; 
        btn.textContent = 'إنشاء الحساب الآن'; 
      }
    }
  </script>
</body>
</html>
