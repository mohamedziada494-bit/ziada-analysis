<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ziada Analysis - مساعد التحكيم الذكي (AI Vision)</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/fix-webm-duration@1.0.6/fix-webm-duration.min.js"></script>
  <style>
    :root {
      --bg-dark: #070b12; --card-bg: #111827; --border-color: #1f2937;
      --primary: #38bdf8; --accent: #f59e0b; --danger: #ef4444; --success: #10b981;
      --text: #f8fafc; --text-muted: #94a3b8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text); padding: 14px; }
    .main-wrapper { max-width: 1400px; margin: auto; display: flex; flex-direction: column; gap: 14px; }
    
    .top-nav { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 20px; border-radius: 10px; border: 1px solid var(--border-color); }
    .brand-title { font-size: 1.2rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 10px; }
    .btn-top { background: #1f2937; color: var(--primary); border: 1px solid var(--primary); padding: 7px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; text-decoration: none; }
    
    .workspace { display: grid; grid-template-columns: 280px 1fr; gap: 15px; align-items: start; }
    
    .referee-panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; max-height: 75vh; overflow-y: auto; }
    .panel-title { font-size: 13.5px; font-weight: 800; color: var(--accent); text-align: center; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); margin-bottom: 4px; }
    .ref-btn { width: 100%; padding: 10px 12px; border: none; border-radius: 8px; font-weight: 700; font-size: 12.5px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; color: white; background: #1f2937; border: 1px solid #374151; transition: 0.2s;}
    .ref-btn:hover { border-color: var(--primary); background: #374151; }
    
    .video-area { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; position: relative; }
    .video-container { width: 100%; background: #000; border-radius: 8px; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; }
    video { width: 100%; height: 50vh; object-fit: contain; }
    .video-controls { display: flex; justify-content: center; gap: 15px; padding: 10px 0; }
    .control-btn { background: #1f2937; color: #fff; border: 1px solid var(--primary); padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
    .control-btn:hover { background: var(--primary); color: #000; }
    
    .upload-bar { display: flex; gap: 10px; align-items: center; background: #070b12; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); }
    input[type="file"] { color: #fff; font-size: 13px; }

    .live-status-banner { display: none; background: rgba(56, 189, 248, 0.15); border: 1px solid var(--primary); color: var(--primary); padding: 10px 16px; border-radius: 8px; font-weight: 800; font-size: 13px; align-items: center; gap: 10px; margin-bottom: 5px; }

    /* ستايل شات الذكاء الاصطناعي */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
    .modal-content { background: #111827; border: 2px solid var(--primary); border-radius: 12px; width: 650px; max-width: 95%; display: flex; flex-direction: column; height: 80vh; box-shadow: 0 0 30px rgba(56,189,248,0.3); overflow: hidden; }
    
    .chat-header { background: #1f2937; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--primary); }
    .chat-header h3 { font-size: 16px; color: var(--primary); margin: 0; display: flex; align-items: center; gap: 10px; }
    .btn-close-chat { background: transparent; border: none; color: #ef4444; font-size: 20px; cursor: pointer; }
    
    .chat-history { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: #070b12; }
    
    .chat-msg { max-width: 85%; padding: 12px 16px; border-radius: 10px; font-size: 13.5px; line-height: 1.6; position: relative; }
    .msg-ai { background: #1f2937; color: #fff; align-self: flex-start; border-top-right-radius: 0; border: 1px solid #374151; }
    .msg-ai b { color: var(--primary); display: block; margin-bottom: 5px; font-size: 14.5px; }
    .msg-ai .highlight { color: var(--accent); }
    .msg-user { background: #0284c7; color: #fff; align-self: flex-end; border-top-left-radius: 0; }
    
    .typing-indicator { display: none; align-self: flex-start; padding: 10px 15px; background: #1f2937; border-radius: 10px; color: var(--primary); font-size: 13px; font-weight: bold; }

    .chat-input-area { padding: 15px; background: #1f2937; border-top: 1px solid #374151; display: flex; gap: 10px; }
    .chat-input-area input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #374151; background: #070b12; color: #fff; font-size: 13px; font-family: 'Cairo'; }
    .chat-input-area input:focus { outline: none; border-color: var(--primary); }
    .chat-input-area button { background: var(--primary); color: #000; border: none; padding: 0 20px; border-radius: 8px; font-weight: 800; cursor: pointer; transition: 0.2s; }
    .chat-input-area button:hover { background: #0284c7; color: #fff; }

    /* الجدول */
    .log-section { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; margin-top: 14px; }
    .log-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: right; margin-top: 10px; }
    .log-table th { background: #1f2937; color: var(--primary); padding: 9px; font-size: 12.5px; }
    .log-table td { padding: 8px 10px; border-bottom: 1px solid var(--border-color); font-weight: 600; }
    .btn-download { background: var(--success); color: #fff; padding: 6px 12px; border-radius: 5px; text-decoration: none; font-size: 11px; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <header class="top-nav">
      <span class="brand-title"><i class="fa-solid fa-eye"></i> Ziada Analysis | المعلم ومحاكي التحكيم الذكي (AI Vision)</span>
      <a href="index.html" class="btn-top">الرئيسية</a>
    </header>

    <div class="workspace">
      <aside class="referee-panel">
        <div class="panel-title">تحليل الحالات بالرؤية الحاسوبية</div>
        <button class="ref-btn" onclick="startAIChat('تسلل (Offside)')">تسلل (Offside) <i class="fa-solid fa-flag"></i></button>
        <button class="ref-btn" onclick="startAIChat('لمس يد')">لمس يد (Handball) <i class="fa-solid fa-hand"></i></button>
        <button class="ref-btn" onclick="startAIChat('تدخل متهور (فاول)')">تدخل متهور (Foul) <i class="fa-solid fa-ban"></i></button>
        <button class="ref-btn" onclick="startAIChat('لعب خطر')">لعب خطر <i class="fa-solid fa-triangle-exclamation"></i></button>
        <button class="ref-btn" onclick="startAIChat('منع هجمة واعدة')">منع هجمة واعدة <i class="fa-solid fa-shield"></i></button>
        <button class="ref-btn" onclick="startAIChat('حرمان من هدف محقق')">حرمان من هدف <i class="fa-solid fa-lock"></i></button>
        <button class="ref-btn" onclick="startAIChat('ركلة جزاء')">ركلة جزاء <i class="fa-solid fa-futbol"></i></button>
      </aside>

      <main class="video-area">
        <div class="live-status-banner" id="liveStatusBanner">
          <i class="fa-solid fa-circle-notch fa-spin"></i>
          <span id="liveStatusText">جاري التصدير...</span>
        </div>
        <div class="video-container">
          <video id="refVideo" controls playsinline></video>
        </div>
        <div class="video-controls">
          <button class="control-btn" onclick="seekVideo(-5)"><i class="fa-solid fa-backward-step"></i> رجوع 5ث</button>
          <button class="control-btn" onclick="seekVideo(5)">تقديم 5ث <i class="fa-solid fa-forward-step"></i></button>
        </div>
        <div class="upload-bar">
          <input type="file" id="videoFileInput" accept="video/*" onchange="loadVideo(event)" style="color:#fff;">
        </div>
      </main>
    </div>

    <div class="log-section">
      <table class="log-table">
        <thead>
          <tr>
            <th>التوقيت</th>
            <th>نوع الحالة المقصوصة</th>
            <th>مكتبة اللقطات (10ث)</th>
          </tr>
        </thead>
        <tbody id="refLogBody">
          <tr><td colspan="3" style="text-align: center; color: var(--text-muted);">لم يتم استخراج لقطات حتى الآن.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <canvas id="liveRenderCanvas" style="display: none;"></canvas>

  <div class="modal-overlay" id="aiChatModal">
    <div class="modal-content">
      <div class="chat-header">
        <h3><i class="fa-solid fa-eye"></i> المعلم التحكيمي الذكي (AI Vision)</h3>
        <button class="btn-close-chat" onclick="closeChat()"><i class="fa-solid fa-circle-xmark"></i></button>
      </div>
      
      <div class="chat-history" id="chatHistory"></div>
      <div class="typing-indicator" id="typingIndicator">المعلم يفحص الصورة المأخوذة من اللقطة الآن... <i class="fa-solid fa-circle-notch fa-spin"></i></div>

      <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="تناقش مع المعلم حول تفاصيل اللقطة..." onkeypress="handleEnter(event)">
        <button onclick="sendUserMessage()"><i class="fa-solid fa-paper-plane"></i> إرسال</button>
      </div>
    </div>
  </div>

  <script>
    // مفتاح الـ API المربوط بحسابك
    const GEMINI_API_KEY = "AIzaSyAZkiGKIyI7RseJ2WYFs-IfqDL0XDxLP3E";

    const video = document.getElementById('refVideo');
    const chatModal = document.getElementById('aiChatModal');
    const chatHistory = document.getElementById('chatHistory');
    const chatInput = document.getElementById('chatInput');
    const typingIndicator = document.getElementById('typingIndicator');
    const statusBanner = document.getElementById('liveStatusBanner');
    
    let currentEvent = '';
    let currentTime = 0;
    let refEventsLog = [];
    let conversationContext = [];

    function loadVideo(e) { if(e.target.files[0]) { video.src = URL.createObjectURL(e.target.files[0]); video.load(); } }
    function seekVideo(sec) { if(video.src) video.currentTime += sec; }
    function formatTime(sec) { const m = Math.floor(sec/60); const s = Math.floor(sec%60); return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }

    // إعداد شخصية الذكاء الاصطناعي
    const systemPrompt = `أنت 'المعلم التحكيمي الذكي'، خبير دولي في قوانين كرة القدم (IFAB) وتعمل كمساعد لمحلل أداء مصري اسمه كوتش زيادة. تتحدث باللهجة المصرية ومصطلحات كرة القدم الدارجة. سيتم تزويدك بصورة (Screenshot) من فيديو المباراة لحظة وقوع حالة تحكيمية. مهمتك فحص الصورة بدقة، وتحليل تمركز اللاعبين والكرة، ووصف ما تراه، ثم إعطاء قرارك التحكيمي بناءً على قوانين IFAB. كن مختصراً واحترافياً.`;

    async function startAIChat(eventType) {
      if (!video.src) return alert("شغل الفيديو أولاً يا كوتش!");
      video.pause();
      currentEvent = eventType;
      currentTime = video.currentTime;
      
      chatHistory.innerHTML = '';
      chatInput.value = '';
      conversationContext = [];
      chatModal.style.display = 'flex';
      
      // 1. التقاط سكرين شوت من الفيديو باستخدام Canvas
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

      const initialUIMsg = `أهلاً بك يا كوتش. لقد قمت بالتقاط صورة للقطة <b>(${eventType})</b> في الدقيقة ${formatTime(currentTime)}.<br>أنا الآن أفحص الصورة بصرياً وأحلل تمركز اللاعبين... لحظات.`;
      appendMessage('ai', initialUIMsg);
      typingIndicator.style.display = 'block';

      // 2. تجهيز الطلب لعين الذكاء الاصطناعي متضمناً الصورة
      const userPromptForVision = `أنت خبير تحكيم. انظر إلى هذه الصورة المأخوذة من مباراة كرة قدم. نوع الحالة المشتبه بها: ${eventType}. حلل ما تراه في الصورة بدقة: أين الكرة؟ أين اللاعبون المعنيون؟ هل يوجد أي احتكاك واضح أو وضع غير طبيعي لليد؟ ما هو قرارك التحكيمي المبدئي بناء على قوانين IFAB بناء على ما تراه؟ تحدث باللهجة المصرية.`;

      conversationContext.push({
        "role": "user",
        "parts": [
          { "text": userPromptForVision },
          { "inlineData": { "mimeType": "image/jpeg", "data": base64Image } }
        ]
      });

      // 3. إرسال الصورة لـ Gemini API
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            "system_instruction": { "parts": [{ "text": systemPrompt }] },
            "contents": conversationContext
          })
        });

        const data = await response.json();
        typingIndicator.style.display = 'none';
        
        if (data.error) {
          appendMessage('ai', `عذراً يا كوتش، في مشكلة في السيرفر: ${data.error.message}`);
        } else {
          const aiResponseText = data.candidates[0].content.parts[0].text;
          appendMessage('ai', aiResponseText);
          conversationContext.push({ "role": "model", "parts": [{ "text": aiResponseText }] });
        }
      } catch (error) {
        typingIndicator.style.display = 'none';
        appendMessage('ai', 'عذراً يا كوتش، حدث خطأ في رفع الصورة للذكاء الاصطناعي.');
      }

      // 4. قص اللقطة في الخلفية 10 ثواني
      await generateClipBlob();
    }

    function closeChat() { chatModal.style.display = 'none'; if(video.paused) video.play(); }

    function appendMessage(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `chat-msg msg-${sender}`;
      // تنظيف تنسيقات ماركداون البسيطة من جيميني
      const formattedText = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\*(.*?)\*/g, '<span class="highlight">$1</span>');
      msgDiv.innerHTML = sender === 'ai' ? `<b>المعلم الذكي:</b> ${formattedText}` : formattedText;
      chatHistory.appendChild(msgDiv);
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function handleEnter(e) { if(e.key === 'Enter') sendUserMessage(); }

    async function sendUserMessage() {
      const text = chatInput.value.trim();
      if(!text) return;
      
      appendMessage('user', text);
      chatInput.value = '';
      typingIndicator.style.display = 'block';
      chatHistory.scrollTop = chatHistory.scrollHeight;

      // تحديث سياق المحادثة بدون رفع الصورة مرة تانية عشان نوفر استهلاك
      conversationContext.push({ "role": "user", "parts": [{ "text": text }] });

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            "system_instruction": { "parts": [{ "text": systemPrompt }] },
            "contents": conversationContext
          })
        });

        const data = await response.json();
        typingIndicator.style.display = 'none';
        if (data.error) {
          appendMessage('ai', `مشكلة في السيرفر: ${data.error.message}`);
        } else {
          const aiResponseText = data.candidates[0].content.parts[0].text;
          appendMessage('ai', aiResponseText);
          conversationContext.push({ "role": "model", "parts": [{ "text": aiResponseText }] });
        }
      } catch (error) {
        typingIndicator.style.display = 'none';
        appendMessage('ai', 'خطأ في الاتصال بالذكاء الاصطناعي.');
      }
    }

    async function generateClipBlob() {
      const startTime = Math.max(0, currentTime - 5);
      const endTime = Math.min(video.duration || (currentTime + 5), currentTime + 5);
      
      statusBanner.style.display = 'flex';
      document.getElementById('liveStatusText').innerText = `السيستم يقوم باقتطاع وتجهيز اللقطة (5ث قبل وبعد) في الخلفية...`;

      try {
        const canvas = document.getElementById('liveRenderCanvas');
        canvas.width = video.videoWidth || 1280; canvas.height = video.videoHeight || 720;
        const ctx = canvas.getContext('2d');
        const stream = canvas.captureStream(30);
        let recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
        const chunks = [];
        recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        
        recorder.start();
        const originalTime = video.currentTime;
        video.currentTime = startTime;
        await new Promise(r => { video.onseeked = r; });
        await video.play();

        function stepFrame() {
          if (video.currentTime >= endTime || video.paused) { 
            video.pause(); recorder.stop(); video.currentTime = originalTime; return; 
          }
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          setTimeout(stepFrame, 1000/30);
        }
        stepFrame();

        recorder.onstop = async () => {
          const rawBlob = new Blob(chunks, { type: 'video/webm' });
          let finalBlob = rawBlob;
          if (typeof ysFixWebmDuration !== 'undefined') {
            finalBlob = await new Promise(res => ysFixWebmDuration(rawBlob, 10000, res));
          }
          const url = URL.createObjectURL(finalBlob);
          refEventsLog.push({ time: formatTime(currentTime), type: currentEvent, blobUrl: url });
          renderLog();
          statusBanner.style.display = 'none';
        };
      } catch(err) {
        statusBanner.style.display = 'none';
      }
    }

    function renderLog() {
      const tbody = document.getElementById('refLogBody');
      if(refEventsLog.length === 0) return;
      tbody.innerHTML = refEventsLog.slice().reverse().map(item => `
        <tr>
          <td>${item.time}</td>
          <td><b>${item.type}</b></td>
          <td><a href="${item.blobUrl}" download="لقطة_${item.type.replace(/ /g, '_')}_${Date.now()}.webm" class="btn-download"><i class="fa-solid fa-download"></i> حفظ اللقطة</a></td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
