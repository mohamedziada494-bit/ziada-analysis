<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ziada Analysis - نظام تحليل الحكام بالذكاء الاصطناعي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/fix-webm-duration@1.0.6/fix-webm-duration.min.js"></script>
  <style>
    :root {
      --bg-dark: #070b12; --card-bg: #111827; --border-color: #1f2937;
      --primary: #38bdf8; --accent: #f59e0b; --danger: #ef4444; --success: #10b981;
      --text: #f8fafc; --text-muted: #94a3b8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text); padding: 14px; }
    .main-wrapper { max-width: 1400px; margin: auto; display: flex; flex-direction: column; gap: 14px; }
    .top-nav { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 20px; border-radius: 10px; border: 1px solid var(--border-color); }
    .brand-title { font-size: 1.2rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 10px; }
    .btn-top { background: #1f2937; color: var(--primary); border: 1px solid var(--primary); padding: 7px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; text-decoration: none; }
    
    .workspace { display: grid; grid-template-columns: 280px 1fr; gap: 15px; align-items: start; }
    .referee-panel { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; max-height: 75vh; overflow-y: auto; }
    .panel-title { font-size: 13.5px; font-weight: 800; color: var(--accent); text-align: center; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); margin-bottom: 4px; }
    .ref-btn { width: 100%; padding: 10px 12px; border: none; border-radius: 8px; font-weight: 700; font-size: 12.5px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; color: white; background: #1f2937; border: 1px solid #374151; }
    
    .video-area { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; position: relative; }
    .video-container { width: 100%; background: #000; border-radius: 8px; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; }
    video { width: 100%; height: 50vh; object-fit: contain; }
    .video-controls { display: flex; justify-content: center; gap: 15px; padding: 10px 0; }
    .control-btn { background: #1f2937; color: #fff; border: 1px solid var(--primary); padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
    
    .ai-scanning-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 10; justify-content: center; align-items: center; flex-direction: column; gap: 10px; border-radius: 8px; }
    .ai-scanning-overlay i { font-size: 40px; color: var(--primary); animation: spin 2s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: #111827; border: 2px solid var(--primary); padding: 20px; border-radius: 12px; width: 600px; max-width: 95%; text-align: right; }
    .law-box { background: #070b12; border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; font-size: 13px; color: #cbd5e1; margin-bottom: 15px; }
    
    .pitch-container { position: relative; width: 100%; height: 200px; background: #15803d; border: 2px solid #fff; border-radius: 4px; margin-bottom: 15px; overflow: hidden; }
    .pitch-container::before { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #fff; transform: translateX(-50%); }
    .pitch-container::after { content: ''; position: absolute; top: 50%; left: 50%; width: 60px; height: 60px; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); }
    .dot { position: absolute; width: 12px; height: 12px; border-radius: 50%; transform: translate(-50%, -50%); border: 2px solid #fff; box-shadow: 0 0 5px #000; }
    
    .log-section { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; margin-top: 14px; }
    .log-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: right; margin-top: 10px; }
    .log-table th { background: #1f2937; color: var(--primary); padding: 9px; font-size: 12.5px; }
    .log-table td { padding: 8px 10px; border-bottom: 1px solid var(--border-color); font-weight: 600; }
    .btn-download { background: var(--success); color: #fff; padding: 5px 10px; border-radius: 5px; text-decoration: none; font-size: 11px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <header class="top-nav">
      <span class="brand-title"><i class="fa-solid fa-robot"></i> Ziada Analysis | المعلم الذكي (AI)</span>
      <a href="index.html" class="btn-top">الرئيسية</a>
    </header>

    <div class="workspace">
      <aside class="referee-panel">
        <div class="panel-title">تحليل الحالات (IFAB)</div>
        <button class="ref-btn" onclick="startAIAnalysis('تسلل (Offside)')">تسلل (Offside) <i class="fa-solid fa-flag"></i></button>
        <button class="ref-btn" onclick="startAIAnalysis('لمس يد')">لمس يد (Handball) <i class="fa-solid fa-hand"></i></button>
        <button class="ref-btn" onclick="startAIAnalysis('تدخل متهور (فاول)')">تدخل متهور <i class="fa-solid fa-ban"></i></button>
        <button class="ref-btn" onclick="startAIAnalysis('لعب خطر')">لعب خطر <i class="fa-solid fa-triangle-exclamation"></i></button>
        <button class="ref-btn" onclick="startAIAnalysis('منع هجمة واعدة')">منع هجمة واعدة <i class="fa-solid fa-shield"></i></button>
        <button class="ref-btn" onclick="startAIAnalysis('حرمان من هدف')">حرمان من هدف محقق <i class="fa-solid fa-lock"></i></button>
        <button class="ref-btn" onclick="startAIAnalysis('ركلة جزاء')">ركلة جزاء <i class="fa-solid fa-futbol"></i></button>
      </aside>

      <main class="video-area">
        <div class="video-container">
          <video id="refVideo" controls playsinline></video>
          <div class="ai-scanning-overlay" id="aiScanner">
            <i class="fa-solid fa-crosshairs"></i>
            <span style="color: #fff; font-weight: bold;">الذكاء الاصطناعي يقوم بتحليل تمركز الحكم واللقطة...</span>
          </div>
        </div>
        <div class="video-controls">
          <button class="control-btn" onclick="seekVideo(-5)">رجوع 5ث</button>
          <button class="control-btn" onclick="seekVideo(5)">تقديم 5ث</button>
        </div>
        <div>
          <input type="file" id="videoFileInput" accept="video/*" onchange="loadVideo(event)" style="color:#fff;">
        </div>
      </main>
    </div>

    <div class="log-section">
      <table class="log-table">
        <thead>
          <tr>
            <th>التوقيت</th>
            <th>نوع الحالة</th>
            <th>حكم الـ AI</th>
            <th>المسافة (AI)</th>
            <th>اللقطة (10ث)</th>
          </tr>
        </thead>
        <tbody id="refLogBody">
          <tr><td colspan="5" style="text-align: center;">لم يتم تسجيل حالات.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <canvas id="liveRenderCanvas" style="display: none;"></canvas>

  <div class="modal-overlay" id="analysisModal">
    <div class="modal-content">
      <div class="law-header" style="border-bottom: 1px solid #1f2937; padding-bottom:10px; margin-bottom:10px;">
        <h3 id="modalTitle" style="color: var(--primary);">نتيجة فحص الذكاء الاصطناعي</h3>
      </div>
      <h2 id="aiVerdict" style="text-align: center; margin-bottom: 10px;"></h2>
      <div class="law-box" id="modalLawText"></div>
      
      <div style="font-size: 13px; color: var(--primary); margin-bottom: 5px; text-align:center;">رصد الـ AI لتمركز الحكم (أصفر) والكرة (أحمر)</div>
      <div class="pitch-container" id="pitchMap"></div>
      <div id="aiDistance" style="text-align: center; font-weight: bold; margin-bottom: 15px; color:#cbd5e1;"></div>

      <button style="width:100%; padding:10px; background:var(--primary); font-weight:bold; cursor:pointer; border:none; border-radius:5px;" onclick="closeModalAndClip()">حفظ النتيجة في السجل وقص اللقطة</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('refVideo');
    const modal = document.getElementById('analysisModal');
    const scanner = document.getElementById('aiScanner');
    const pitchMap = document.getElementById('pitchMap');
    let currentEvent = '';
    let currentTime = 0;
    let refEventsLog = [];

    const ruleBook = {
      'تسلل (Offside)': 'المادة 11: يعتبر متسللاً إذا كان أقرب لخط المرمى من الكرة وثاني آخر منافس.',
      'لمس يد': 'المادة 12: خطأ إذا تعمد لمس الكرة أو كبّر مساحة جسمه بشكل غير طبيعي.',
      'تدخل متهور (فاول)': 'المادة 12: يحدث عند الإهمال أو التهور.',
      'لعب خطر': 'المادة 12: تصرف يهدد بإصابة منافس دون احتكاك فعلي.',
      'منع هجمة واعدة': 'المادة 12: يستوجب إنذار (كارت أصفر).',
      'حرمان من هدف': 'المادة 12: يستوجب البطاقة الحمراء.',
      'ركلة جزاء': 'تُحتسب لخطأ مباشر يرتكبه المدافع داخل منطقة جزائه.'
    };

    function loadVideo(e) { if(e.target.files[0]) { video.src = URL.createObjectURL(e.target.files[0]); video.load(); } }
    function seekVideo(sec) { if(video.src) video.currentTime += sec; }
    function formatTime(sec) { const m = Math.floor(sec/60); const s = Math.floor(sec%60); return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }

    function startAIAnalysis(eventType) {
      if (!video.src) return alert("شغل الفيديو أولاً.");
      video.pause();
      currentEvent = eventType;
      currentTime = video.currentTime;
      
      scanner.style.display = 'flex';
      setTimeout(showAnalysisResult, 2000); // محاكاة المعالجة
    }

    function showAnalysisResult() {
      scanner.style.display = 'none';
      const isCorrect = Math.random() > 0.4;
      const verdictEl = document.getElementById('aiVerdict');
      
      verdictEl.innerText = isCorrect ? '✅ قرار الحكم في اللقطة سليم' : '❌ قرار الحكم في اللقطة خاطئ';
      verdictEl.style.color = isCorrect ? 'var(--success)' : 'var(--danger)';
      document.getElementById('modalLawText').innerHTML = `<b>توجيه IFAB:</b> ${ruleBook[currentEvent] || ''}`;

      // محاكاة رصد التمركز
      pitchMap.innerHTML = '';
      const foulX = 20 + Math.random() * 60; const foulY = 20 + Math.random() * 60;
      const refX = foulX + (Math.random() * 20 - 10); const refY = foulY + (Math.random() * 20 - 10);
      
      pitchMap.innerHTML += `<div class="dot" style="left:${foulX}%; top:${foulY}%; background:#ef4444;"></div>`;
      pitchMap.innerHTML += `<div class="dot" style="left:${refX}%; top:${refY}%; background:#eab308;"></div>`;
      
      const dist = Math.floor(Math.random() * 15) + 5;
      document.getElementById('aiDistance').innerText = `المسافة المقدرة: ${dist} متر`;
      
      modal.isCorrect = isCorrect;
      modal.dist = dist;
      modal.style.display = 'flex';
    }

    async function closeModalAndClip() {
      modal.style.display = 'none';
      await generateClipBlob();
    }

    async function generateClipBlob() {
      const startTime = Math.max(0, currentTime - 5);
      const endTime = Math.min(video.duration || (currentTime + 5), currentTime + 5);
      
      const canvas = document.getElementById('liveRenderCanvas');
      canvas.width = video.videoWidth || 1280; canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');
      const stream = canvas.captureStream(30);
      let recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
      const chunks = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      
      recorder.start();
      video.currentTime = startTime;
      await new Promise(r => { video.onseeked = r; });
      await video.play();

      function stepFrame() {
        if (video.currentTime >= endTime || video.paused) { video.pause(); recorder.stop(); return; }
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        setTimeout(stepFrame, 1000/30);
      }
      stepFrame();

      recorder.onstop = () => {
        const rawBlob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(rawBlob);
        
        refEventsLog.push({
          time: formatTime(currentTime),
          type: currentEvent,
          decision: modal.isCorrect ? 'سليم ✅' : 'خاطئ ❌',
          dist: `${modal.dist} متر`,
          blobUrl: url
        });
        
        renderLog();
      };
    }

    function renderLog() {
      const tbody = document.getElementById('refLogBody');
      tbody.innerHTML = refEventsLog.slice().reverse().map((item, i) => `
        <tr>
          <td>${item.time}</td>
          <td>${item.type}</td>
          <td style="color: ${item.decision.includes('سليم') ? '#34d399' : '#f87171'};">${item.decision}</td>
          <td>${item.dist}</td>
          <td><a href="${item.blobUrl}" download="لقطة_${item.type}_${Date.now()}.webm" class="btn-download"><i class="fa-solid fa-download"></i> حفظ للحاسوب</a></td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
